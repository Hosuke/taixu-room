    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall — The Chinese Buddhist Canon</a> › <a href="/en/masters/">Patriarchs</a> › 師備</nav></header><main><article><h1>師備</h1><p>玄沙師備 · 五代十國 · 835-908</p><p>本以漁為業，年三十出家，行頭陀，號備頭陀。嗣雪峯義存，住福州玄沙。傳羅漢桂琛，法眼宗之所自出。</p><p>Also known as: 釋師備、釋玄沙、玄沙備、備頭陀、宗一大師、謝三郎</p></article></main></div></div>
