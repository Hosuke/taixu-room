    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall — The Chinese Buddhist Canon</a> › <a href="/en/masters/">Patriarchs</a> › 善昭</nav></header><main><article><h1>善昭</h1><p>汾陽善昭 · 北宋 · 946-1023</p><p>遍參諸方，後嗣首山省念，住汾州太子院。作頌古百則，開宋代頌古之風；門下石霜楚圓出黃龍、楊岐二派。</p><p>Also known as: 汾陽、汾陽昭、無德禪師、太子昭、汾州、西河師子</p></article></main></div></div>
