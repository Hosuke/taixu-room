    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 西瞿耶尼</nav></header><main><article><h1>西瞿耶尼</h1><p>此云牛貨，亦翻取與。</p><p>《翻譯名義集》卷三〈世界篇第二十七〉釋曰：</p><p>&gt; 【西瞿耶尼】此云牛貨，亦翻取與。《藏疏》云：「以彼多牛，以牛為貨。」《俱舍鈔》云：「劫初時，因高樹下，有一寶牛，為貨易故。」《西域記》云：「西瞿陀尼洲，舊曰瞿那尼，又云劬伽尼，訛。」《俱舍》云：「西牛貨洲，壽五百歲，相圓無缺，長十六肘。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈世界篇第二十七〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1096b04</p></article></main></div></div>
