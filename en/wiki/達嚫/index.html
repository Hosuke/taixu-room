    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 達嚫</nav></header><main><article><h1>達嚫</h1><p>尊婆須密論作檀嚫，此云財施。</p><p>《翻譯名義集》卷四〈眾善行法篇第四十八〉釋曰：</p><p>&gt; 【達嚫】尊婆須密論作檀嚫，此云財施。解言報施之法，名曰達嚫，導引福地，亦名達嚫。字或從手。《西域記》「正云達嚫拏者，右也。或云馱器尼，以用右手受人所施，為其生福故。」肇云：「夫以方會人，不可以一息期；以財濟物，不可以一時周。是以會通無隅者，彌綸而不漏；法澤冥被者，不易而普覆。」</p><p><strong>所出</strong>：《翻譯名義集》卷四〈眾善行法篇第四十八〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1127a14</p></article></main></div></div>
