    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 四果無得</nav></header><main><article><h1>四果無得</h1><p>須陀洹、斯陀含、阿那含、阿羅漢四果，皆無所得也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：四果能作是念「我得某果」不？皆答言不也。何以故？四果名入流、一往來、不來、無學，而實無入、無往來、無來、無法名阿羅漢。是故[[降伏其心]]者，無四相，無所得也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
