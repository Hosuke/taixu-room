    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 法性無邊</nav></header><main><article><h1>法性無邊</h1><p>法性浩瀚無際，非心所能度量。</p><p>慧忠法師序《心經》云：「夫法性無邊，豈藉心之所度。」</p><p>法性者，諸法實相之異名也。其體無邊無際，不可測度，不可以尋常之心思而分別之。一切法皆依法性而立，然法性非一二三四之數量所拘，故曰無邊。慧忠以此破執文求義之迷，謂學者若以分別心度量法性，愈度愈遠，終不可得。</p><p><strong>所出</strong>：《般若波羅蜜多心經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0251.xml</p></article></main></div></div>
