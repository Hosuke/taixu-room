    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 宗主</nav></header><main><article><h1>宗主</h1><p>僧史略云。唐末寺皆立受依止闍梨一員。</p><p>《釋氏要覽》卷上〈稱謂〉釋曰：</p><p>&gt; 僧史略云。唐末寺皆立受依止闍梨一員。今朝取秉律員。位最高者號宗主。蓋道俗之間。有諍不分曲直。告具剖斷。令人息諍故也。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈稱謂〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0261c15</p></article></main></div></div>
