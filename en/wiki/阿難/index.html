    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 阿難</nav></header><main><article><h1>阿難</h1><p>《大論》：「秦言歡喜。</p><p>《翻譯名義集》卷一〈十大弟子篇第八〉釋曰：</p><p>&gt; 【阿難】《大論》：「秦言歡喜。佛成道時，斛飯王家使來白淨飯王言：『貴弟生男。』王心歡喜，言：『今日大吉。』語來使言：『是男當字為阿難。』舉國欣慶。又名慶喜。亦翻無染。雖殘思未盡，隨佛入天人龍宮，見女，心無染著故。」《玄》云：「持三藏教。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈十大弟子篇第八〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1064a12</p></article></main></div></div>
