    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 受戒始</nav></header><main><article><h1>受戒始</h1><p>大戒法本。自曹魏黃初三年壬寅。</p><p>《釋氏要覽》卷上〈戒法〉釋曰：</p><p>&gt; 大戒法本。自曹魏黃初三年壬寅。已到許昌。以國家多事。寢經三十三年至廢帝（即高貴卿公也）登位改正元元年甲戌。天竺律師曇摩迦羅上書。方興受戒之事（逆推至佛法初到。後漢求平十年丁卯。經一百七十八年。凡出家者。惟受三歸戒故）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈戒法〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0273b08</p></article></main></div></div>
