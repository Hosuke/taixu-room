    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 凡夫非凡夫</nav></header><main><article><h1>凡夫非凡夫</h1><p>凡夫者，[[如來]]說則非凡夫也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：如來說有我者，則非有我，而凡夫之人以為有我。凡夫者，如來說則非凡夫。此[[四相非相]]之應用，[[無為法差別]]之旁證也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
