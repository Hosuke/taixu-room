    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 忍辱非忍辱</nav></header><main><article><h1>忍辱非忍辱</h1><p>忍辱波羅蜜非忍辱波羅蜜，[[如來]]昔被歌利王割截也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：忍辱波羅蜜，如來說非忍辱波羅蜜。如我昔為歌利王割截身體，我於爾時，無我相、無人相、無眾生相、無壽者相。又念過去於五百世作忍辱仙人，於爾所世，無四相。此[[降伏其心]]之實踐典範也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
