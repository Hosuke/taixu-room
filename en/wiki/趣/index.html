    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 趣</nav></header><main><article><h1>趣</h1><p>即五趣也。一天。二人。三地獄。</p><p>《釋氏要覽》卷中〈界趣〉釋曰：</p><p>&gt; 即五趣也。一天。二人。三地獄。四畜生。五餓鬼。謂修羅四趣皆攝故。今開為一趣。故云六趣也。趣者何義。毘婆沙論云。所往義。是諸有情。所應往結生之處故名趣也○毘曇論云。趣到義。謂彼善惡業因能令有情到其生處。又道義。故名六道矣。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈界趣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0291a17</p></article></main></div></div>
