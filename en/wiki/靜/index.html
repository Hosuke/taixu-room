    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 靜</nav></header><main><article><h1>靜</h1><p>能斷金剛論云。定名靜以得禪者說名寂靜。</p><p>《釋氏要覽》卷下〈躁靜〉釋曰：</p><p>&gt; 能斷金剛論云。定名靜以得禪者說名寂靜。寂靜有二種。一心寂靜。二身寂靜。今以四句料簡。一有身欲寂靜。而心不寂靜。謂貪欲比丘林下坐禪。二．有心寂靜而身不寂靜。謂。無貪瞋比丘親近王臣。三．有身心俱寂靜。謂。諸聖人。四身心俱不寂靜。謂凡夫。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈躁靜〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0297a12</p></article></main></div></div>
