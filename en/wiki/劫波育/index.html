    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 劫波育</nav></header><main><article><h1>劫波育</h1><p>或言劫貝，即木綿也。</p><p>《翻譯名義集》卷七〈沙門服相篇第六十一〉釋曰：</p><p>&gt; 【劫波育】或言劫貝，即木綿也。正言迦波羅。此樹華名也，可以為布。高昌名㲲。罽賓國南，大者成樹，已北形小，狀如土葵，有殼，剖以出華，如柳絮，可紉（女真）以為布。</p><p><strong>所出</strong>：《翻譯名義集》卷七〈沙門服相篇第六十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1172a18</p></article></main></div></div>
