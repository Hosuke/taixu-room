    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 阿羅漢</nav></header><main><article><h1>阿羅漢</h1><p>佛弟子修行之聖果，聲聞乘之究竟果位。</p><p>阿羅漢，梵語Arhat，佛弟子修行之聖果，聲聞乘之究竟果位也。</p><p>釋尊成正覺後，入波羅奈斯城為五侍者說四諦法，數年中聞法之下得成阿羅漢者不可勝紀，著名者若舍利弗、目犍連、大迦葉等皆在其列。</p><p><strong>所出</strong>：《太虛大師全書．第一編　佛法總學(第1卷-第26卷)》 — https://github.com/cbeta-org/xml-p5/blob/master/TX/TX01/TX01n0001.xml</p></article></main></div></div>
