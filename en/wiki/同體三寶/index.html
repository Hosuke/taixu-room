    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 同體三寶</nav></header><main><article><h1>同體三寶</h1><p>謂佛法僧名雖有三體性是一故名同體三寶。</p><p>《大明三藏法數》卷五釋曰（出華嚴經隨䟽演義鈔并三寶章）：</p><p>&gt; 謂佛法僧名雖有三體性是一故名同體三寶。
&gt;
&gt; 【一佛寶】佛梵語具云佛陀華言覺謂性體靈覺照了諸法非空非有是名佛寶。
&gt;
&gt; 【二法寶】法即軌持之義謂法性寂滅而恒沙性德皆可軌持是名法寶。
&gt;
&gt; 【三僧寶】僧梵語具云僧伽華言和合眾謂恒沙妙德性相不二理事和合是名僧寶。</p><p><strong>所出</strong>：《大明三藏法數》卷五 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0557a01</p></article></main></div></div>
