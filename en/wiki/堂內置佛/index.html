    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 堂內置佛</nav></header><main><article><h1>堂內置佛</h1><p>南山鈔云。無常堂內置一立像金薄塗之。</p><p>《釋氏要覽》卷下〈贍病〉釋曰：</p><p>&gt; 南山鈔云。無常堂內置一立像金薄塗之。面向西方左手中指繫一五綵幡幡脚曳地有比丘病甚者當洗拭易衣安置（像後）左手執幡脚作隨佛往生之意也。贍病者當為燒香散華𠇮僧念誦乃至隨機說法（鈔有廣文）若至甚者不更移動只於像後以俟命終。或有吐唾便利贍病人隨時除去無有罪也（鈔有問答）。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈贍病〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0306b29</p></article></main></div></div>
