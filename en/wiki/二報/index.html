    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 二報</nav></header><main><article><h1>二報</h1><p>【一依報】依報亦名依果即世界國土也謂諸眾生各各隨其果報之身依之而住故名依報。</p><p>《大明三藏法數》卷四釋曰（出華嚴經䟽）：</p><p>&gt; 【一依報】依報亦名依果即世界國土也謂諸眾生各各隨其果報之身依之而住故名依報。
&gt;
&gt; 【二正報】正報亦名正果即五陰之身也謂諸眾生隨其所作善惡之業各各感得此身正受其報故名正報（五陰者色陰受陰想陰行陰識陰也）。</p><p><strong>所出</strong>：《大明三藏法數》卷四 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0535b02</p></article></main></div></div>
