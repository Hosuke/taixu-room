    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 教訶弟子</nav></header><main><article><h1>教訶弟子</h1><p>菩薩善戒經云為師不能教訶弟子。</p><p>《釋氏要覽》卷上〈師資〉釋曰：</p><p>&gt; 菩薩善戒經云為師不能教訶弟子。則破佛法當墮地獄○毘奈耶云。弟子有五事。方可教訶。一不信。二懈怠。三惡口。四情無羞恥。五近惡知識。佛言但五法有一。皆須教訶。比丘問佛。如何教訶。有五法。一不共語。二不教授。三不同受用。四遮其善事不與依止。五不與同房。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈師資〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0266c02</p></article></main></div></div>
