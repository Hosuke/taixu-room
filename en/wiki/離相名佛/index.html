    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 離相名佛</nav></header><main><article><h1>離相名佛</h1><p>離一切諸相，則名[[如來]]也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：若復有人得聞是經，不驚、不怖、不畏，當知是人甚為希有。何以故？離一切諸相，則名[[如來]]。此[[四相非相]]之究竟義，[[金剛般若]]之極說也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
