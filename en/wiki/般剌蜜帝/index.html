    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 般剌蜜帝</nav></header><main><article><h1>般剌蜜帝</h1><p>唐云極量。</p><p>《翻譯名義集》卷一〈宗翻譯主篇第十一〉釋曰：</p><p>&gt; 【般剌蜜帝】唐云極量。中印度人。懷道觀方，隨緣濟度，展轉遊化，達我支那。乃於廣州制旨道場，譯《首楞嚴》。自漢至唐，翻譯儒釋，總有二百九十二人，今略編集。現行經人，苟欲具知，當披新舊《譯經圖紀》。</p><p><strong>所出</strong>：《翻譯名義集》卷一〈宗翻譯主篇第十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1072a09</p></article></main></div></div>
