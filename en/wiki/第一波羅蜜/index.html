    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 第一波羅蜜</nav></header><main><article><h1>第一波羅蜜</h1><p>[[如來]]說第一波羅蜜，非第一波羅蜜，是名第一波羅蜜也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：[[如來]]說第一波羅蜜，非第一波羅蜜，是名第一波羅蜜。六度之中，般若波羅蜜最尊，故名第一。而說「非第一」，顯般若之空性也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
