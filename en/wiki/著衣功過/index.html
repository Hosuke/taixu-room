    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 著衣功過</nav></header><main><article><h1>著衣功過</h1><p>佛告阿難。衣有二種。謂可親。</p><p>《釋氏要覽》卷上〈法衣〉釋曰：</p><p>&gt; 佛告阿難。衣有二種。謂可親。不可親若著好衣。益其道心。此可親。若損道心。此不可親。是故。或從好衣得道。或從弊衣得道。所悟在心。不拘形服○智度論云。佛言從今日。若有比丘。一心求涅槃。背捨世間者。我聽著價直十萬兩金衣。食百味食。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈法衣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0269c14</p></article></main></div></div>
