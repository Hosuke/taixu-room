    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 夏臘</nav></header><main><article><h1>夏臘</h1><p>即釋氏法歲也。凡序長幻。</p><p>《釋氏要覽》卷下〈入眾〉釋曰：</p><p>&gt; 即釋氏法歲也。凡序長幻。必問。夏臘多者為長。故云天竺以臈人為驗焉。經音䟽增輝記皆云。臘接也（蔡邕獨斷云。臈者。歲之終也。晉博士張亮議云。臈接也新故交接俗謂臈之明日為初歲也。今釋氏。自四月十六日）。前安居入制。至七月十五日。為受臘之日。若俗歲除日也。至十六日。是五分法身生養之日。名新歲也自夏九旬。統名法歲矣。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈入眾〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0298c29</p></article></main></div></div>
