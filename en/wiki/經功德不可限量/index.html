    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 經功德不可限量</nav></header><main><article><h1>經功德不可限量</h1><p>是經有不可思議、不可稱量、無邊功德也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：以要言之，是經有不可思議、不可稱量、無邊功德。如來為發大乘者說，為發最上乘者說。若有人能受持讀誦、廣為人說，如來悉知悉見是人，皆得成就不可量、不可稱、無有邊、不可思議功德。此[[經法所出]]之總嘆，[[金剛般若]]之殊勝也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
