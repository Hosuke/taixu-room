    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 盂蘭盆</nav></header><main><article><h1>盂蘭盆</h1><p>盂蘭，西域之語，轉此翻倒懸。</p><p>《翻譯名義集》卷四〈十二分教篇第四十〉釋曰：</p><p>&gt; 【盂蘭盆】盂蘭，西域之語，轉此翻倒懸。盆是此方貯食之器。三藏云：「盆羅百味，式貢三尊。仰大眾之恩光，救倒懸之窘急。」義當救倒懸器（如《孟子》云：「當今之時，萬乘之國行仁政，民之悅之，如解倒懸。」）。應法師云：「盂蘭言訛，正云烏藍婆拏，此云救倒懸。」</p><p><strong>所出</strong>：《翻譯名義集》卷四〈十二分教篇第四十〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1112c03</p></article></main></div></div>
