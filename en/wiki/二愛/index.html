    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 二愛</nav></header><main><article><h1>二愛</h1><p>【一欲愛】謂眾生愛念妻子及貪染五欲等是名欲愛（五欲者以色聲香味觸五塵能起人貪欲之心也）。</p><p>《大明三藏法數》卷四釋曰（出大智度論）：</p><p>&gt; 【一欲愛】謂眾生愛念妻子及貪染五欲等是名欲愛（五欲者以色聲香味觸五塵能起人貪欲之心也）。
&gt;
&gt; 【二法愛】謂菩薩以平等心而生法喜欲令一切眾生皆至佛道是名法愛。</p><p><strong>所出</strong>：《大明三藏法數》卷四 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0532a06</p></article></main></div></div>
