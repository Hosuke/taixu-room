    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 辨法法性論</nav></header><main><article><h1>辨法法性論</h1><p>彌勒菩薩闡法與法性對辨、轉依要義之論典</p><p>《辨法法性論》，彌勒菩薩造，苾芻法尊於民國譯漢。論以偈頌廣釋法與法性之二分，施設六相通達法、六相通達法性、十相通達轉依，顯無分別智之相狀與勝利，兼明加行位次、過患勝利。全文分判生死、涅槃二門，示虛妄分別是雜染之因，轉依清淨為修行之果。論末以虛空金水為轉依之喻，要歸於唯識無境、一切相無得之旨。</p><p><strong>所出</strong>：《辨法法性論》 — https://github.com/cbeta-org/xml-p5/blob/master/B/B09/B09n0034.xml</p></article></main></div></div>
