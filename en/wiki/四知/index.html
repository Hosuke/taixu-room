    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 四知</nav></header><main><article><h1>四知</h1><p>【一天知】謂人一念心起若善若惡雖未形現天神已自知之照臨於上矣。</p><p>《大明三藏法數》卷十四釋曰（出佛說罵意經）：</p><p>&gt; 【一天知】謂人一念心起若善若惡雖未形現天神已自知之照臨於上矣。
&gt;
&gt; 【二地知】謂人一念心起若善若惡雖未形現地神已自知之鑒察於下矣。
&gt;
&gt; 【三傍人知】謂人作善作惡於隱僻之處自謂無人知而不知傍人已知之矣。
&gt;
&gt; 【四自知】謂心欲作善作惡人雖未知自意已先知之矣。</p><p><strong>所出</strong>：《大明三藏法數》卷十四 — https://cbetaonline.dila.edu.tw/zh/P182n1615_p0001a03</p></article></main></div></div>
