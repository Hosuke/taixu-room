    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 恒河沙數佛世界</nav></header><main><article><h1>恒河沙數佛世界</h1><p>如一恒河中所有沙，有如是等恒河，是諸恒河所有沙數佛世界也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：如一恒河中所有沙，有如是等恒河，是諸恒河所有沙數佛世界，如是寧為多不？答言甚多。此[[恒河沙數]]之極說，顯宇宙之無量，眾生之無邊也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
