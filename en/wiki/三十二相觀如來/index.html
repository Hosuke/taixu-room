    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 三十二相觀如來</nav></header><main><article><h1>三十二相觀如來</h1><p>若以三十二相觀[[如來]]，轉輪聖王則是如來也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：可以三十二相觀如來不？答初言如是如是，後言不應以三十二相觀如來。如來遂言：若以三十二相觀如來者，轉輪聖王則是如來。此[[凡所有相皆是虛妄]]之重申，[[見如來]]之正觀也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
