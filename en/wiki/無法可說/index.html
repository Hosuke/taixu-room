    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 無法可說</nav></header><main><article><h1>無法可說</h1><p>說法者，無法可說，是名說法也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：汝勿謂[[如來]]作是念「我當有所說法」。莫作是念，何以故？若人言如來有所說法，即為謗佛，不能解我所說故。說法者，無法可說，是名說法。此[[無為法差別]]之延伸，[[依法不依人]]之究竟義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
