    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 姞栗陀</nav></header><main><article><h1>姞栗陀</h1><p>此云鷲。</p><p>《翻譯名義集》卷二〈畜生篇第二十二〉釋曰：</p><p>&gt; 【姞栗陀】此云鷲。或揭羅闍，此云雕鷲。《山海經》曰：「景山多鷲。」《說文》：「鷲鳥黑色多子。」師曠云：「南山有鳥，名曰羌鷲，黃頭赤咽，五色皆備。」西域多此鳥，蒼黃目赤，食死屍。</p><p><strong>所出</strong>：《翻譯名義集》卷二〈畜生篇第二十二〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1091a14</p></article></main></div></div>
