    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 長老巡寮</nav></header><main><article><h1>長老巡寮</h1><p>今禪居常式也。僧祇律云。</p><p>《釋氏要覽》卷下〈住持〉釋曰：</p><p>&gt; 今禪居常式也。僧祇律云。世尊以五事故五日一按行僧房。一恐弟子著有為事。二恐著俗論。三恐著睡眠。四為看病僧。五令少年比丘見佛威儀亦生歡憙故（言寮者。唐韻云同官曰寮今禪居意取多人同居共司一務故稱寮也。又欲別律住房名故）。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈住持〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0302b11</p></article></main></div></div>
