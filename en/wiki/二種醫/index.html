    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 二種醫</nav></header><main><article><h1>二種醫</h1><p>【一小醫】謂但知病知病因知差病藥而不知一切病不知一切病因不知一切差病藥以譬聲聞不能徧知藥病是名小醫。</p><p>《大明三藏法數》卷三釋曰（出大智度論）：</p><p>&gt; 【一小醫】謂但知病知病因知差病藥而不知一切病不知一切病因不知一切差病藥以譬聲聞不能徧知藥病是名小醫。
&gt;
&gt; 【二大醫】謂一切病一切病因一切差病之藥皆能徧知乃至徧知眾生病因差病藥等以譬菩薩無病不知無藥不識是名大醫。</p><p><strong>所出</strong>：《大明三藏法數》卷三 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0503a02</p></article></main></div></div>
