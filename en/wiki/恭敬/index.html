    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 恭敬</nav></header><main><article><h1>恭敬</h1><p>四分律云。汝等比丘。於我法中出家。</p><p>《釋氏要覽》卷中〈禮數〉釋曰：</p><p>&gt; 四分律云。汝等比丘。於我法中出家。更相恭敬。佛法可得流布○毘尼母云。佛言吾去世後當依波羅提木叉行法。當各各謙卑。除去憍慢○戒本云。若比丘不恭敬。犯波逸提罪○地持論云。若見年長福德勝者。應起奉迎禮拜問訊。若見德與己等（者。先意問訊。謙下軟語。不生慢憍。若見年德於己少者。應先意軟語。心不輕慢。設其有罪終不譏刺）。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈禮數〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0278a08</p></article></main></div></div>
