    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 信心清淨生實相</nav></header><main><article><h1>信心清淨生實相</h1><p>得聞是經，信心清淨，則生實相也。</p><p>[[如來]]借[[阿羅漢]][[須菩提]]之言以明：若復有人得聞是經，信心清淨，則生實相。當知是人成就第一希有功德。是實相者，則是非相，是故[[如來]]說名實相。此[[現實]]之深義，[[依法不依人]]之驗證也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
