    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 波陀</nav></header><main><article><h1>波陀</h1><p>秦言句，句謂句逗。</p><p>《翻譯名義集》卷五〈名句文法篇第五十二〉釋曰：</p><p>&gt; 【波陀】秦言句，句謂句逗。逗，止也，住也。《大論》云：「天竺語法，眾字和合成語，眾語和合成句。如菩為一字，提為一字，是二不合則無語，若和合名為菩提。」《大乘入楞伽》云：「句身者，謂能顯義決定究竟。」《成唯識論》云：「句詮差別，如名為眼，即詮自性。若言佛眼、天眼，乃顯句詮差別也。」</p><p><strong>所出</strong>：《翻譯名義集》卷五〈名句文法篇第五十二〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1137a22</p></article></main></div></div>
