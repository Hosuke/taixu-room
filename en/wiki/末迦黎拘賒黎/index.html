    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 末迦黎拘賒黎</nav></header><main><article><h1>末迦黎拘賒黎</h1><p>末伽黎，此云不見道。</p><p>《翻譯名義集》卷二〈六師篇第二十〉釋曰：</p><p>&gt; 【末迦黎拘賒黎】末伽黎，此云不見道。什曰：「末伽黎，字也。拘賒黎，是其母也。」肇曰：「其人起見，謂眾生苦樂，不因行得，皆自然耳。」淨覺謂：「計自然者，亦是斷滅。自然，然，是也；自，如是也。《婆沙》云：『法應爾，不可改易，不可徵詰，是法爾義。』自然與法爾同。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈六師篇第二十〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1085a13</p></article></main></div></div>
