    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 盜三寶物結罪處</nav></header><main><article><h1>盜三寶物結罪處</h1><p>大毘婆沙論問云。若盜佛塔物。</p><p>《釋氏要覽》卷中〈三寶〉釋曰：</p><p>&gt; 大毘婆沙論問云。若盜佛塔物。於誰處得根本業道。答於國王施主及守護人天處結罪。有說。於佛邊結罪此物為佛攝受故。若盜亡僧物者。若已作羯磨。於羯磨眾處得。若夫作羯磨者。普於一切善說法眾處。得根本業道。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈三寶〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0289b03</p></article></main></div></div>
