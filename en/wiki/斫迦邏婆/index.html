    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 斫迦邏婆</nav></header><main><article><h1>斫迦邏婆</h1><p>此云鴛鴦，匹鳥也。</p><p>《翻譯名義集》卷二〈畜生篇第二十二〉釋曰：</p><p>&gt; 【斫迦邏婆】此云鴛鴦，匹鳥也。止則相耦，飛則相雙。〈鳥喻品〉云：「一者迦隣提，二者鴛鴦。游止共俱，不相捨離。」今師釋曰：「以雄喻常，雌喻無常。生死有性善故，無常即常，如二鳥在下。涅槃有性惡故，常即無常，如二鳥高飛。是則在高在下，雌雄共俱，雙游並息，其義皆成。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈畜生篇第二十二〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1090b25</p></article></main></div></div>
