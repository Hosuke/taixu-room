    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 身命布施</nav></header><main><article><h1>身命布施</h1><p>以恒河沙等身命布施，不及持經功德也。</p><p>[[如來]]言[[阿羅漢]][[須菩提]]：若有善男子、善女人，以恒河沙等身命布施；若復有人，於此經中乃至受持四句偈等為他人說，其福甚多。此[[恒河沙數]]之進深比喻，明法施之功，勝於財施、命施也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
