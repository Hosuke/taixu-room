    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 投針</nav></header><main><article><h1>投針</h1><p>西域記云。西天十五祖迦那提婆。</p><p>《釋氏要覽》卷中〈志學〉釋曰：</p><p>&gt; 西域記云。西天十五祖迦那提婆。初謁龍猛（菩薩本滿猛以金盛）水令弟子持示之。提婆見默以針投之。弟子持返。猛問彼何辭乎。答默但投針。猛曰智矣。若人也。宜速命入於斯際會。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈志學〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0293b09</p></article></main></div></div>
