    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 無所住心</nav></header><main><article><h1>無所住心</h1><p>應無所住而生其心，此[[如來]]所以教[[阿羅漢]]也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：[[阿羅漢]]應如是生清淨心，不應住色生心，不應住聲、香、味、觸、法生心，應無所住而生其心。此[[金剛般若]]之心髓，[[降伏其心]]之正途也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
