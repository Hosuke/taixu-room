    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 慳惜僧物惡報</nav></header><main><article><h1>慳惜僧物惡報</h1><p>付法藏傳云。僧伽耶舍因遊大海邊至一住處堂閣嚴麗滿中。</p><p>《釋氏要覽》卷下〈住持〉釋曰：</p><p>&gt; 付法藏傳云。僧伽耶舍因遊大海邊至一住處堂閣嚴麗滿中。比丘時至鳴鐘集食。食訖爾時餚饍變成膿血便以鉢器互相打擲頭身血污各作是言何惜眾物今受此苦時。耶舍乃問。有一答曰。我等迦葉佛時同止一寺有客比丘來共生嗔恚藏惜飲食不與以此因緣今受此苦。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈住持〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0303a17</p></article></main></div></div>
