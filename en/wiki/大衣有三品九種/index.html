    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 大衣有三品九種</nav></header><main><article><h1>大衣有三品九種</h1><p>薩娑多論云。僧伽梨有三品。</p><p>《釋氏要覽》卷上〈法衣〉釋曰：</p><p>&gt; 薩娑多論云。僧伽梨有三品。自九條。十一條。十三條名下品衣。皆兩長一短作。十五條。十七條。十九條。名中品衣。皆三長一短作。二十一條。二十三條。二十五條。名上品衣。皆四長一短作○增輝記問。七條何品攝。答下品攝。以兩長一短作故（律中三衣。各有廣長肘量既佛言度身而衣更不錄也）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈法衣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0268c03</p></article></main></div></div>
