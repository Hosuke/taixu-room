    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 僧祇支</nav></header><main><article><h1>僧祇支</h1><p>或僧却崎。</p><p>《翻譯名義集》卷七〈沙門服相篇第六十一〉釋曰：</p><p>&gt; 【僧祇支】或僧却崎。《西域記》云：「唐言掩腋。舊或名竭支，正名僧迦鵄。此云覆腋衣。用覆左肩，右開左合。」竺道祖云：「魏時請僧，於內自恣。宮人見僧偏袒，不以為善，遂作此衣施僧。因綴於左邊祇支上，因而受稱，即偏衫右邊。今隱祇支名，通號兩袖曰偏衫。今作時，須開後縫截領，以存元式故也。」</p><p><strong>所出</strong>：《翻譯名義集》卷七〈沙門服相篇第六十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1171c05</p></article></main></div></div>
