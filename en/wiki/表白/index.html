    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 表白</nav></header><main><article><h1>表白</h1><p>僧史略云。亦曰唱導也。始則西域上座凡赴請。</p><p>《釋氏要覽》卷上〈中食〉釋曰：</p><p>&gt; 僧史略云。亦曰唱導也。始則西域上座凡赴請。呪願以悅檀越之心。舍利弗多辯才。曾作上座。讚導頗佳。白衣大歡喜。此為表白之推輪也○梁高僧傳云。夫唱導所貴者。其事四焉。一聲。二辯。三才。四博也。非聲無以警眾。非辯無以適時。非才言無可釆。非博語無依據（陳錢塘高僧真觀有八能。則唱導一也）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈中食〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0276b02</p></article></main></div></div>
