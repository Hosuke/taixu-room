    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 貪</nav></header><main><article><h1>貪</h1><p>瑜伽論云。於諸境界。深起耽著名貪。</p><p>《釋氏要覽》卷下〈躁靜〉釋曰：</p><p>&gt; 瑜伽論云。於諸境界。深起耽著名貪。諸煩惱中。貪為最勝○阿毗達磨論云。貪者。三界愛為體。生眾苦為業（業用也）○法蘊足論云。佛言。汝等若能永斷一法保汝定得不還果。一法者貪也○六度集經云。佛因中曾作鴿王。誡諸鴿曰。佛經眾戒。貪為元首。貪以致榮者。猶餓夫獲毒饍得志之樂其久若電。眾苦困己。其有億載。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈躁靜〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0296a15</p></article></main></div></div>
