    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 問俗人受三歸後違失</nav></header><main><article><h1>問俗人受三歸後違失</h1><p>問若俗人受三歸後。却祀鬼神為失歸戒否。</p><p>《釋氏要覽》卷上〈戒法〉釋曰：</p><p>&gt; 問若俗人受三歸後。却祀鬼神為失歸戒否。答優婆塞戒經云。若人受三歸戒後。為護舍宅。及身命。祀鬼神者。不失。若志心禮外道鬼神者。名失。若祠祀不得殺生命。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈戒法〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0273c15</p></article></main></div></div>
