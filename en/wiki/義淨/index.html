    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 義淨</nav></header><main><article><h1>義淨</h1><p>齊州人，俗姓張，字文明。</p><p>《翻譯名義集》卷一〈宗翻譯主篇第十一〉釋曰：</p><p>&gt; 【義淨】齊州人，俗姓張，字文明。髫齓之年，辭榮落䰂，遍詢名匠，廣探群籍。內外通曉，今古遍知。年十有五，志遊西域，遍師名匠，學大小乘。所為事周，還歸故里。凡所遊歷，三十餘國。往來問道，出二十年。天后證聖，河洛翻譯。</p><p><strong>所出</strong>：《翻譯名義集》卷一〈宗翻譯主篇第十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1071c20</p></article></main></div></div>
