    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall — The Chinese Buddhist Canon</a> › <a href="/en/wiki/">Glossary</a> › 具足色身</nav></header><main><article><h1>具足色身</h1><p>[[如來]]具足色身，即非具足色身，是名具足色身也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：佛可以具足色身見不？答言不也。如來不應以具足色身見。如來說具足色身，即非具足色身，是名具足色身。此[[凡所有相皆是虛妄]]之別說，[[法身]]之隱義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
