    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 披袒</nav></header><main><article><h1>披袒</h1><p>（袒即肉袒）舍利弗問經云。</p><p>《釋氏要覽》卷上〈法衣〉釋曰：</p><p>&gt; （袒即肉袒）舍利弗問經云。於何時披袒（披即通覆兩肩。袒即偏露右臂）。佛言。隨供食時。應偏袒。以便作事故。作福田時。應覆兩肩現福田相故（記云。隨供養者。如見佛。禮佛。問許三師。入眾等時也。作福田者。謂計齊坐禪。誦經。入聚落。樹下坐時。使人見田相端嚴故。若對佛通披者。五百生墮鐵甲地獄）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈法衣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0270a28</p></article></main></div></div>
