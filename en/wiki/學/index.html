    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 學</nav></header><main><article><h1>學</h1><p>効也。白虎通云。學覺也。</p><p>《釋氏要覽》卷中〈志學〉釋曰：</p><p>&gt; 効也。白虎通云。學覺也。覺悟所不知也○中論云。昔之君子成德立身。身沒而名不朽。其故何也。學也。學者。所以疏神達思。怡情治性。聖人之上務也。學猶飾也。器不飾。則無以為美觀。人不學。則無以有懿德。志者。學之師也。學者。患志之不立故。篇目志學焉○僧史略云。夫學不厭博。有所不知。蓋闕如也。此土高僧。能攝異宗者。率由博學之故也。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈志學〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0292c10</p></article></main></div></div>
