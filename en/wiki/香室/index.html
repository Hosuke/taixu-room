    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 香室</nav></header><main><article><h1>香室</h1><p>毘柰耶律義淨三藏注云。西方名佛堂為健陀俱胝。</p><p>《釋氏要覽》卷上〈住處〉釋曰：</p><p>&gt; 毘柰耶律義淨三藏注云。西方名佛堂為健陀俱胝。此云香室。不稱佛堂佛殿者。蓋不欲親觸尊顏故（殿者即此方之制。上安𩿒魚尾者是也。尾今呼為𩿒吻訛也。灸轂子云。漢柏梁殿災天火也。越巫献術取𩿒魚尾置上以禳之。今則象也。若古制尾上更加鐵作水草之形。俗呼為攢鳥者。風俗通曰。古殿多刻蓮荷菱葉之屬水草所以厭火也）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈住處〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0263c12</p></article></main></div></div>
