    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 竺曇摩羅察</nav></header><main><article><h1>竺曇摩羅察</h1><p>此云法護，月氏國人。</p><p>《翻譯名義集》卷一〈宗翻譯主篇第十一〉釋曰：</p><p>&gt; 【竺曇摩羅察】此云法護，月氏國人。甚有識量，天性純懿，操行精苦，篤志好學，萬里尋師。屆茲未久，博覽六經，游心七籍。解三十六種書，詰訓音義無不備識。日誦萬言，過目咸記。先居燉煌，後處青門。《大周目錄》云：「太康七年，譯《正法華》。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈宗翻譯主篇第十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1068c26</p></article></main></div></div>
