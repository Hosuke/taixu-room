    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 滅瞋五觀</nav></header><main><article><h1>滅瞋五觀</h1><p>攝論云。由觀五義。以滅瞋恚。</p><p>《釋氏要覽》卷下〈諍忍〉釋曰：</p><p>&gt; 攝論云。由觀五義。以滅瞋恚。一觀一切眾生無始以來於我有恩。二觀一切眾生常念念滅。三觀唯法無有眾生。何者能損所損四觀一切眾生皆自受苦。云何復加之以苦。五觀一切眾生皆是我子。云何欲生損害。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈諍忍〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0298a14</p></article></main></div></div>
