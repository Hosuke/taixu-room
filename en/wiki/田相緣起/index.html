    <div id="root"><div data-prerender><header><nav><a href="/en/">Taixu Hall</a> › <a href="/en/wiki/">Glossary</a> › 田相緣起</nav></header><main><article><h1>田相緣起</h1><p>僧祇律云。佛住王舍城。帝釋石窟前經行。</p><p>《釋氏要覽》卷上〈法衣〉釋曰：</p><p>&gt; 僧祇律云。佛住王舍城。帝釋石窟前經行。見稻田畦畔分明。語阿難言。過去諸佛衣相如是。從今依此作衣相○增輝記云。田畦貯水。生長嘉苗。以養形命。法衣之田。潤以四利之水。增其三善之苗。以養法身慧命也。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈法衣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0269a20</p></article></main></div></div>
