    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 전등 / 유계전등</nav></header><main><article><h1>전등 / 유계전등</h1><p lang="zh-Hant">傳燈</p><p>유계전등은 유계의 고명사를 근거로 한 명나라 천태 학승입니다. 백송진각에게 배웠으며 천태의 교리와 관법에 관한 글을 지었습니다. 그의 『정토생무생론』은 천태의 일심삼관으로 정토 수행을 풀이합니다.</p><p>幽溪傳燈 · 明 · 1554-1628</p><p>다른 이름: 幽溪、無盡、有門、幽溪無盡</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T47n1975-%E6%B7%A8%E5%9C%9F%E7%94%9F%E7%84%A1%E7%94%9F%E8%AB%96/">淨土生無生論</a></li></ul></article></main></div></div>
