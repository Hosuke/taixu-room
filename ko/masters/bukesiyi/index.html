    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 불가사의</nav></header><main><article><h1>불가사의</h1><p lang="zh-Hant">不可思議</p><p>불가사의는 8세기에 활동한 신라 영묘사의 승려입니다. 전통 기록은 그를 선무외의 제자로 전합니다. 그의 주석은 『대일경』에 따른 공양 절차를 풀이하며, 그 밖의 생애는 확실히 알려진 바가 거의 없습니다.</p><p>不可思議 · 唐・新羅 · 八世紀</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T39n1797-%E5%A4%A7%E6%AF%98%E7%9B%A7%E9%81%AE%E9%82%A3%E7%B6%93%E4%BE%9B%E9%A4%8A%E6%AC%A1%E7%AC%AC%E6%B3%95%E7%96%8F/">大毘盧遮那經供養次第法疏</a></li></ul></article></main></div></div>
