    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 양인산</nav></header><main><article><h1>양인산</h1><p lang="zh-Hant">楊仁山</p><p>양문회(양인산)는 1866년 난징에 금릉각경처를 세워 불교 전적을 수집·간행하여 유통하였습니다. 또한 기원정사 학당을 세웠으며, 태허를 비롯한 근대 불교 부흥의 인물들이 이곳에서 배웠습니다.</p><p>楊文會 · 清末民初 · 1837-1911</p><p>다른 이름: 楊仁山</p></article></main></div></div>
