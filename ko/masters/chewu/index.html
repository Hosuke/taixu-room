    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 제성 / 철오선사</nav></header><main><article><h1>제성 / 철오선사</h1><p lang="zh-Hant">際醒</p><p>철오제성은 몽동이라고도 불리며, 선과 교학을 닦은 청나라의 불교 스승입니다. 뒤에 홍라산에서 법을 펼치며 염불과 정토 수행을 강조하였습니다. 후대 정토종은 그를 제12조로 받듭니다. 그의 제자들이 『철오선사어록』에 그 가르침을 남겼습니다.</p><p>徹悟際醒 · 清 · 1741-1811</p><p>다른 이름: 徹悟、夢東、訥堂、紅螺徹悟</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-X-X62n1182-%E5%BE%B9%E6%82%9F%E7%A6%AA%E5%B8%AB%E8%AA%9E%E9%8C%84/">徹悟禪師語錄</a></li></ul></article></main></div></div>
