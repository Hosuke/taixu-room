    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 지례 / 사명존자</nav></header><main><article><h1>지례 / 사명존자</h1><p lang="zh-Hant">知禮</p><p>사명지례는 사명의 연경사를 근거로 한 북송의 천태 학승입니다. 의통에게 배웠으며 천태 교학의 산가파 해석을 이끈 대표적 인물이 되었습니다. 『십불이문』과 『관무량수경』에 대한 그의 주석은 교리 분석을 관법 수행과 잇습니다.</p><p>四明知禮 · 北宋 · 960-1028</p><p>다른 이름: 四明尊者、法智大師、四明法智</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T46n1928-%E5%8D%81%E4%B8%8D%E4%BA%8C%E9%96%80%E6%8C%87%E8%A6%81%E9%88%94/">十不二門指要鈔</a></li><li><a href="/ko/classics/cbeta-T-T37n1751-%E8%A7%80%E7%84%A1%E9%87%8F%E5%A3%BD%E4%BD%9B%E7%B6%93%E7%96%8F%E5%A6%99%E5%AE%97%E9%88%94/">觀無量壽佛經疏妙宗鈔</a></li></ul></article></main></div></div>
