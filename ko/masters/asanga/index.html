    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 무착</nav></header><main><article><h1>무착</h1><p lang="zh-Hant">無著</p><p>무착은 인도 유가행파의 형성 및 보살도에 관한 논서와 관련된 인물입니다. 그에게 귀속되는 저술로 『섭대승론』과 『대승아비달마집론』이 있으며, 세친과의 관계는 후대 유가행파 법맥 서술의 중심을 이룹니다.</p><p>無著菩薩 · 印度 · 約4-5世紀</p><p>다른 이름: 阿僧伽</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T30n1565-%E9%A0%86%E4%B8%AD%E8%AB%96/">順中論</a></li><li><a href="/ko/classics/cbeta-T-T31n1605-%E5%A4%A7%E4%B9%98%E9%98%BF%E6%AF%98%E9%81%94%E7%A3%A8%E9%9B%86%E8%AB%96/">大乘阿毘達磨集論</a></li></ul></article></main></div></div>
