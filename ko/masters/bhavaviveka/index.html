    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 청변</nav></header><main><article><h1>청변</h1><p lang="zh-Hant">清辨</p><p>청변은 6세기 인도 중관학파의 사상가로, 형식 논증을 써서 공을 옹호하였습니다. 그의 『반야등론』은 용수의 『중론』 게송을 주석한 것으로 한역과 티베트역으로 전합니다. 현장이 한역한 그의 『장진론』은 유식 학승들 사이에서 논쟁의 대상이 되었습니다.</p><p>清辨菩薩 · 印度 · 約500-570</p><p>다른 이름: 分別明、清辯</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T30n1566-%E8%88%AC%E8%8B%A5%E7%87%88%E8%AB%96%E9%87%8B/">般若燈論釋</a></li><li><a href="/ko/classics/cbeta-T-T30n1578-%E5%A4%A7%E4%B9%98%E6%8E%8C%E7%8F%8D%E8%AB%96/">大乘掌珍論</a></li></ul></article></main></div></div>
