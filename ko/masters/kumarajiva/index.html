    <meta property="og:description" content="구마라집(344–413)은 구자에서 자라 중앙아시아와 계빈에서 불법을 배웠습니다. 양주에서 여러 해 억류된 뒤 401년 장안에 이르렀고, 후진의 군주 요흥이 그의 역경을 후원하였습니다. 승조 등 중국 승려들과 함께 『법화경』, 『금강경』, 『유마경』의 영향력 있는 번역을 내었습니다. 그가 번역한 중관 논서들은 뒷날 삼론종의 문헌적 기반이 되었습니다." />

    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 구마라집</nav></header><main><article><h1>구마라집</h1><p lang="zh-Hant">鳩摩羅什</p><p>구마라집(344–413)은 구자에서 자라 중앙아시아와 계빈에서 불법을 배웠습니다. 양주에서 여러 해 억류된 뒤 401년 장안에 이르렀고, 후진의 군주 요흥이 그의 역경을 후원하였습니다. 승조 등 중국 승려들과 함께 『법화경』, 『금강경』, 『유마경』의 영향력 있는 번역을 내었습니다. 그가 번역한 중관 논서들은 뒷날 삼론종의 문헌적 기반이 되었습니다.</p><p>鳩摩羅什 · 姚秦 · 344-413</p><p>다른 이름: 羅什</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T25n1509-%E5%A4%A7%E6%99%BA%E5%BA%A6%E8%AB%96/">大智度論</a></li><li><a href="/ko/classics/cbeta-T-T12n0389-%E4%BD%9B%E5%9E%82%E8%88%AC%E6%B6%85%E6%A7%83%E7%95%A5%E8%AA%AA%E6%95%99%E8%AA%A1%E7%B6%93/">佛垂般涅槃略說教誡經</a></li></ul></article></main></div></div>
