    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 태허 / 태허대사</nav></header><main><article><h1>태허 / 태허대사</h1><p lang="zh-Hant">太虛</p><p>태허는 근대 중국에서 불교 교단, 승가 교육, 신앙 실천의 개혁을 주창하였습니다. 1922년 무창불학원을 세우고 인생불교를 폈습니다. 그의 교판은 중국 불교 팔종을 하나의 공통 틀 안에 아우르고자 하였습니다.</p><p>太虛大師 · 近代 · 1890-1947</p><p>다른 이름: 呂淦森、唯心</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-%E5%A4%AA%E8%99%9B-%E7%AC%AC%E4%B8%80%E7%B7%A8-%E4%BD%9B%E5%AD%B8%E6%A6%82%E8%AB%96/">佛學概論</a></li><li><a href="/ko/classics/cbeta-%E5%A4%AA%E8%99%9B-%E7%AC%AC%E4%B8%80%E7%B7%A8-%E4%BD%9B%E4%B9%98%E5%AE%97%E8%A6%81%E8%AB%96/">佛乘宗要論</a></li><li><a href="/ko/classics/cbeta-%E5%A4%AA%E8%99%9B-%E7%AC%AC%E4%B8%80%E7%B7%A8-%E6%88%91%E6%80%8E%E6%A8%A3%E5%88%A4%E6%94%9D%E4%B8%80%E5%88%87%E4%BD%9B%E6%B3%95/">我怎樣判攝一切佛法</a></li><li><a href="/ko/classics/cbeta-%E5%A4%AA%E8%99%9B-%E7%AC%AC%E4%B8%80%E7%B7%A8-%E4%BD%9B%E6%B3%95%E4%B9%8B%E5%88%86%E5%AE%97%E5%88%A4%E6%95%99/">佛法之分宗判教</a></li><li><a href="/ko/classics/cbeta-%E5%A4%AA%E8%99%9B-%E7%AC%AC%E4%BA%94%E7%B7%A8-%E8%83%BD%E6%96%B7%E9%87%91%E5%89%9B%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BE%85%E5%AF%86%E5%A4%9A%E7%B6%93%E9%87%8B/">能斷金剛般若波羅密多經釋</a></li><li><a href="/ko/classics/cbeta-%E5%A4%AA%E8%99%9B-%E7%AC%AC%E4%BA%94%E7%B7%A8-%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BE%85%E5%AF%86%E5%A4%9A%E5%BF%83%E7%B6%93%E8%AC%9B%E7%BE%A9/">般若波羅密多心經講義</a></li></ul></article></main></div></div>
