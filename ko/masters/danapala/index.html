    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 시호</nav></header><main><article><h1>시호</h1><p lang="zh-Hant">施護</p><p>시호는 북송 역경원에서 활동한 인도 승려입니다. 980년 송나라 도성에 이르러 방대한 불전을 번역하였습니다. 그의 역서에는 밀교의 중요 경전인 『일체여래진실섭경』의 광본 한역이 있습니다.</p><p>施護 · 北宋 · 十至十一世紀</p><p>다른 이름: 傳法大師、明悟</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T30n1575-%E5%85%AD%E5%8D%81%E9%A0%8C%E5%A6%82%E7%90%86%E8%AB%96/">六十頌如理論</a></li><li><a href="/ko/classics/cbeta-T-T18n0882-%E4%BD%9B%E8%AA%AA%E4%B8%80%E5%88%87%E5%A6%82%E4%BE%86%E7%9C%9F%E5%AF%A6%E6%94%9D%E5%A4%A7%E4%B9%98%E7%8F%BE%E8%AD%89%E4%B8%89%E6%98%A7%E5%A4%A7%E6%95%99%E7%8E%8B%E7%B6%93/">佛說一切如來真實攝大乘現證三昧大教王經</a></li></ul></article></main></div></div>
