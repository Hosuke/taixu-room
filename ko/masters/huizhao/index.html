    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 혜소</nav></header><main><article><h1>혜소</h1><p lang="zh-Hant">慧沼</p><p>혜소는 중국 법상종에서 규기의 유식 해석을 이었습니다. 그의 『성유식론요의등』은 『성유식론』에 대한 다른 해석들에 맞서 그 해석을 옹호합니다. 다음 세대에서 지주가 그의 주석 작업을 이었습니다. 그의 입적은 흔히 714년으로 보지만, DILA가 인용한 비문에 근거한 재검토는 726년에서 741년 사이로 봅니다.</p><p>淄州慧沼 · 唐 · 648-714（通說）</p><p>다른 이름: 惠沼、淄州、淄州大師</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T43n1832-%E6%88%90%E5%94%AF%E8%AD%98%E8%AB%96%E4%BA%86%E7%BE%A9%E7%87%88/">成唯識論了義燈</a></li></ul></article></main></div></div>
