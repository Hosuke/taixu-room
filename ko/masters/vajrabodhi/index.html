    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 금강지</nav></header><main><article><h1>금강지</h1><p lang="zh-Hant">金剛智</p><p>금강지(671–741)는 바닷길로 스리랑카와 동남아시아를 거쳐 720년 중국에 이른 인도 승려입니다. 장안에서 밀교 경전을 번역하고 금강정경 계통과 금강계에 관련된 관정과 의례 수행을 가르쳤습니다. 제자 불공이 그를 도왔으며 그의 사후에 이 사업을 이어 갔습니다. 그는 선무외, 불공과 함께 개원삼대사의 한 사람으로 알려져 있습니다.</p><p>金剛智三藏 · 唐 · 671-741</p></article></main></div></div>
