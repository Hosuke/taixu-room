    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 보리유지</nav></header><main><article><h1>보리유지</h1><p lang="zh-Hant">菩提流支</p><p>보리유지는 북위 508년 낙양에 이른 인도의 역경승입니다. 그의 역서에는 유가행파 논서와 세친의 『왕생론』이 있습니다. 뒷날 같은 이름으로 불린 당나라 역경승과는 다른 인물입니다.</p><p>北魏菩提流支 · 北魏 · 六世紀</p><p>다른 이름: 菩提留支、道希</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T26n1524-%E7%84%A1%E9%87%8F%E5%A3%BD%E7%B6%93%E5%84%AA%E6%B3%A2%E6%8F%90%E8%88%8D/">無量壽經優波提舍</a></li></ul></article></main></div></div>
