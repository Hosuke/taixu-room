    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 종밀 / 규봉종밀</nav></header><main><article><h1>종밀 / 규봉종밀</h1><p lang="zh-Hant">宗密</p><p>종밀은 징관의 화엄 교학과 하택종 수주도원에게서 받은 선 수행을 아울렀습니다. 그의 『원인론』은 인간 본성에 대한 불교, 유교, 도교의 설명을 견줍니다. 『원각경』에 대한 그의 주석은 교학과 선정을 잇습니다.</p><p>圭峰宗密 · 唐 · 780-841</p><p>다른 이름: 圭峰、圭峰大師、荷澤宗密</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-X-X09n0243-%E5%9C%93%E8%A6%BA%E7%B6%93%E5%A4%A7%E7%96%8F/">圓覺經大疏</a></li><li><a href="/ko/classics/cbeta-T-T39n1795-%E5%A4%A7%E6%96%B9%E5%BB%A3%E5%9C%93%E8%A6%BA%E4%BF%AE%E5%A4%9A%E7%BE%85%E4%BA%86%E7%BE%A9%E7%B6%93%E7%95%A5%E7%96%8F/">大方廣圓覺修多羅了義經略疏</a></li><li><a href="/ko/classics/cbeta-T-T33n1701-%E9%87%91%E5%89%9B%E8%88%AC%E8%8B%A5%E7%B6%93%E7%96%8F%E8%AB%96%E7%BA%82%E8%A6%81%E5%8D%B7001/">金剛般若經疏論纂要</a></li><li><a href="/ko/classics/cbeta-T-T45n1884-%E8%A8%BB%E8%8F%AF%E5%9A%B4%E6%B3%95%E7%95%8C%E8%A7%80%E9%96%80/">註華嚴法界觀門</a></li><li><a href="/ko/classics/cbeta-T-T45n1886-%E5%8E%9F%E4%BA%BA%E8%AB%96/">原人論</a></li><li><a href="/ko/classics/cbeta-T-T48n2015-%E7%A6%AA%E6%BA%90%E8%AB%B8%E8%A9%AE%E9%9B%86%E9%83%BD%E5%BA%8F/">禪源諸詮集都序</a></li></ul></article></main></div></div>
