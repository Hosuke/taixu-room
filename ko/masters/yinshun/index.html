    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 인순</nav></header><main><article><h1>인순</h1><p lang="zh-Hant">印順</p><p>인순은 태허가 이끈 불교 개혁 운동에 참여하면서 인도 불교와 중국 불교에 대한 역사적 연구를 발전시켰습니다. 저서로 『성불지도』와 중국 선종사 연구서가 있으며, 그가 설한 인간불교는 이후 대만 불교계에 영향을 주었습니다.</p><p>印順導師 · 現代 · 1906-2005</p></article></main></div></div>
