    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 선도 / 선도대사</nav></header><main><article><h1>선도 / 선도대사</h1><p lang="zh-Hant">善導</p><p>선도(613–681)는 현중사에서 도작에게 정토 수행을 배운 뒤 장안에서 법을 펼쳤습니다. 그의 『관경소』는 아미타불 정토 왕생을 부처님의 서원과 범부의 수행이라는 관점에서 풀이합니다. 그는 아미타불의 명호를 부르는 칭명염불에 특히 무게를 두면서 관상과 의례 수행도 가르쳤습니다. 그의 저술은 중국과 일본 정토 전통의 주요 원천이 되었습니다.</p><p>善導大師 · 唐 · 613-681</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T37n1753-%E8%A7%80%E7%84%A1%E9%87%8F%E5%A3%BD%E4%BD%9B%E7%B6%93%E7%96%8F/">觀無量壽佛經疏</a></li><li><a href="/ko/classics/cbeta-T-T47n1980-%E5%BE%80%E7%94%9F%E7%A6%AE%E8%AE%9A%E5%81%88/">往生禮讚偈</a></li><li><a href="/ko/classics/cbeta-T-T47n1959-%E8%A7%80%E5%BF%B5%E9%98%BF%E5%BD%8C%E9%99%80%E4%BD%9B%E7%9B%B8%E6%B5%B7%E4%B8%89%E6%98%A7%E5%8A%9F%E5%BE%B7%E6%B3%95%E9%96%80/">觀念阿彌陀佛相海三昧功德法門</a></li></ul></article></main></div></div>
