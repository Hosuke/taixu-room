    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 담란</nav></header><main><article><h1>담란</h1><p lang="zh-Hant">曇鸞</p><p>담란은 세친의 저술로 전해지는 『왕생론』에 주석을 지었습니다. 이 주석은 아미타불의 서원과 공덕 회향을 통해 정토 수행을 설명하며, 도작과 선도 등 후대의 스승들이 그 주제를 발전시켰습니다.</p><p>曇鸞大師 · 北魏 · 476-542</p><h2>저술과 역경</h2><ul><li><a href="/ko/classics/cbeta-T-T40n1819-%E7%84%A1%E9%87%8F%E5%A3%BD%E7%B6%93%E5%84%AA%E5%A9%86%E6%8F%90%E8%88%8D%E9%A1%98%E7%94%9F%E5%81%88%E8%A8%BB/">無量壽經優婆提舍願生偈註</a></li></ul></article></main></div></div>
