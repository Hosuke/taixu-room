    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 달마 / 보리달마</nav></header><main><article><h1>달마 / 보리달마</h1><p lang="zh-Hant">達摩</p><p>초기 중국 문헌은 보리달마를 선정 및 『능가경』과 관련된 가르침과 연결합니다. 후대 선종 계보는 그를 중국 초조이자 혜가의 스승으로 삼습니다. 『이입사행론』이 그의 저술로 전해지지만, 그의 전기 대부분은 후대의 전설에 속합니다.</p><p>菩提達摩 · 南北朝 · c.5-6世紀</p><p>다른 이름: 達磨</p><p>소속 종파：<a href="/zong/chan/">禪宗</a>、西天二十八祖、東土六祖</p><h2>본사</h2><ul><li><a href="/ko/masters/prajnatara/">반야다라</a></li></ul><h2>제자</h2><ul><li><a href="/ko/masters/huike/">혜가</a></li></ul><p>관련 조사：<a href="/ko/masters/sengcan/">승찬</a>、<a href="/ko/masters/daoxin/">도신</a>、<a href="/ko/masters/hongren/">홍인</a>、<a href="/ko/masters/huineng/">혜능 / 육조대사</a></p><p>주석한 경론：<a href="/ko/classics/%E6%A5%9E%E4%BC%BD%E9%98%BF%E8%B7%8B%E5%A4%9A%E7%BE%85%E5%AF%B6%E7%B6%93/">楞伽阿跋多羅寶經</a></p></article></main></div></div>
