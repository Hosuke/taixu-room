    <div id="root"><div data-prerender><header><nav><a href="/ko/">太虛間</a> › <a href="/ko/masters/">조사</a> › 달마 / 보리달마</nav></header><main><article><h1>달마 / 보리달마</h1><p lang="zh-Hant">達摩</p><p>초기 중국 문헌은 보리달마를 선정 및 『능가경』과 관련된 가르침과 연결합니다. 후대 선종 계보는 그를 중국 초조이자 혜가의 스승으로 삼습니다. 『이입사행론』이 그의 저술로 전해지지만, 그의 전기 대부분은 후대의 전설에 속합니다.</p><p>菩提達摩 · 南北朝 · c.5-6世紀</p><p>다른 이름: 達磨</p></article></main></div></div>
