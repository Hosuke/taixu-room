    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 慧能（六祖）</nav></header><main><article><h1>慧能（六祖）</h1><p lang="zh-Hant">慧能</p><p>えのう</p><p>慧能（638–713）は曹渓と宝林寺にゆかりのある、華南の禅の師として記憶されている。後代の系譜は彼を弘忍の後継者、中国の第六祖とする。『六祖壇経』は頓悟と定慧不二に関する教えを彼の名のもとに示す。八世紀に神会がその系統を宣揚し、のちの隆盛の基を築いた。その伝記の多くは後世の回顧的な宗教的叙述として伝わり、細部をすべて史実とみなすことはできない。</p><p>六祖慧能 · 唐 · 638-713</p><p>別称：惠能、六祖</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T48n2007-%E5%85%AD%E7%A5%96%E5%A3%87%E7%B6%93/">六祖壇經</a></li></ul></article></main></div></div>
