    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 施護</nav></header><main><article><h1>施護</h1><p lang="zh-Hant">施護</p><p>せご</p><p>施護（十〜十一世紀）は北宋の訳経院で活動したインド僧である。980年に宋の都に至り、多量の仏典を翻訳した。その訳業には、密教の重要経典『一切如来真実摂大乗現証三昧大教王経』の大部な漢訳が含まれる。</p><p>施護 · 北宋 · 十至十一世紀</p><p>別称：傳法大師、明悟</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T30n1575-%E5%85%AD%E5%8D%81%E9%A0%8C%E5%A6%82%E7%90%86%E8%AB%96/">六十頌如理論</a></li><li><a href="/ja/classics/cbeta-T-T18n0882-%E4%BD%9B%E8%AA%AA%E4%B8%80%E5%88%87%E5%A6%82%E4%BE%86%E7%9C%9F%E5%AF%A6%E6%94%9D%E5%A4%A7%E4%B9%98%E7%8F%BE%E8%AD%89%E4%B8%89%E6%98%A7%E5%A4%A7%E6%95%99%E7%8E%8B%E7%B6%93/">佛說一切如來真實攝大乘現證三昧大教王經</a></li></ul></article></main></div></div>
