    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 清弁</nav></header><main><article><h1>清弁</h1><p lang="zh-Hant">清辨</p><p>しょうべん</p><p>清弁（約500–570）は六世紀インドの中観派の思想家で、論理学的な推論を用いて空を擁護した。龍樹の中頌に対する注釈『般若灯論』は漢訳とチベット訳で現存する。その『大乗掌珍論』は玄奘によって漢訳され、瑜伽行派の学者の間で議論の的となった。</p><p>清辨菩薩 · 印度 · 約500-570</p><p>別称：分別明、清辯</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T30n1566-%E8%88%AC%E8%8B%A5%E7%87%88%E8%AB%96%E9%87%8B/">般若燈論釋</a></li><li><a href="/ja/classics/cbeta-T-T30n1578-%E5%A4%A7%E4%B9%98%E6%8E%8C%E7%8F%8D%E8%AB%96/">大乘掌珍論</a></li></ul></article></main></div></div>
