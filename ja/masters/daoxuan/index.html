    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 道宣（南山律師）</nav></header><main><article><h1>道宣（南山律師）</h1><p lang="zh-Hant">道宣</p><p>どうせん</p><p>道宣（596–667）は智首に戒律を学び、その活動の多くを長安と終南山の周辺で過ごした。『四分律』に対する注釈は南山律宗の基礎を築いた。一時玄奘の訳経に協力し、西明寺の上座も務めた。その『続高僧伝』などの史書は、中国仏教の制度と修行者に関する豊富な記録を伝えている。</p><p>南山道宣 · 唐 · 596-667</p><p>別称：南山律師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T40n1804-%E5%9B%9B%E5%88%86%E5%BE%8B%E5%88%AA%E7%B9%81%E8%A3%9C%E9%97%95%E8%A1%8C%E4%BA%8B%E9%88%94%E5%8D%B7001a/">四分律刪繁補闕行事鈔</a></li><li><a href="/ja/classics/cbeta-T-T40n1806-%E5%9B%9B%E5%88%86%E5%BE%8B%E6%AF%94%E4%B8%98%E5%90%AB%E6%B3%A8%E6%88%92%E6%9C%AC/">四分律比丘含注戒本</a></li><li><a href="/ja/classics/cbeta-T-T40n1808-%E5%9B%9B%E5%88%86%E5%BE%8B%E5%88%AA%E8%A3%9C%E9%9A%A8%E6%A9%9F%E7%BE%AF%E7%A3%A8/">四分律刪補隨機羯磨</a></li><li><a href="/ja/classics/cbeta-X-X41n0728-%E5%9B%9B%E5%88%86%E5%BE%8B%E5%88%AA%E8%A3%9C%E9%9A%A8%E6%A9%9F%E7%BE%AF%E7%A3%A8%E7%96%8F%E6%BF%9F%E7%B7%A3%E8%A8%98/">四分律刪補隨機羯磨疏濟緣記</a></li><li><a href="/ja/classics/cbeta-T-T45n1897-%E6%95%99%E8%AA%A1%E6%96%B0%E5%AD%B8%E6%AF%94%E4%B8%98%E8%A1%8C%E8%AD%B7%E5%BE%8B%E5%84%80/">教誡新學比丘行護律儀</a></li><li><a href="/ja/classics/cbeta-X-X41n0730-%E6%AF%97%E5%B0%BC%E4%BD%9C%E6%8C%81%E7%BA%8C%E9%87%8B/">毗尼作持續釋</a></li></ul></article></main></div></div>
