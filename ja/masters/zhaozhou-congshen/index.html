    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 趙州従諗</nav></header><main><article><h1>趙州従諗</h1><p lang="zh-Hant">從諗</p><p>じょうしゅうじゅうしん</p><p>趙州従諗（778–897）は南泉普願の法系に属し、のち趙州の観音院を拠点とした禅僧である。彼に帰せられる問答は、後世の禅籍で広く用いられる公案となった。</p><p>趙州從諗 · 唐 · 778-897</p><p>別称：真際從諗、真際大師、趙州真際、趙州和尚、趙州古佛、趙州諗</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-J-J24nB137-%E8%B6%99%E5%B7%9E%E5%92%8C%E5%B0%9A%E8%AA%9E%E9%8C%84/">趙州和尚語錄</a></li></ul></article></main></div></div>
