    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 善導</nav></header><main><article><h1>善導</h1><p lang="zh-Hant">善導</p><p>ぜんどう</p><p>善導（613–681）は玄中寺で道綽のもと浄土の行を学んだのち、長安で教化した。その『観無量寿経疏』は、阿弥陀仏の浄土への往生を仏の本願と凡夫の行という観点から説き明かす。阿弥陀仏の名号を称えることを特に重んじつつ、観想や儀礼の実践も教えた。その著作は中国と日本の浄土の伝統の主要な典拠となった。</p><p>善導大師 · 唐 · 613-681</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T37n1753-%E8%A7%80%E7%84%A1%E9%87%8F%E5%A3%BD%E4%BD%9B%E7%B6%93%E7%96%8F/">觀無量壽佛經疏</a></li><li><a href="/ja/classics/cbeta-T-T47n1980-%E5%BE%80%E7%94%9F%E7%A6%AE%E8%AE%9A%E5%81%88/">往生禮讚偈</a></li><li><a href="/ja/classics/cbeta-T-T47n1959-%E8%A7%80%E5%BF%B5%E9%98%BF%E5%BD%8C%E9%99%80%E4%BD%9B%E7%9B%B8%E6%B5%B7%E4%B8%89%E6%98%A7%E5%8A%9F%E5%BE%B7%E6%B3%95%E9%96%80/">觀念阿彌陀佛相海三昧功德法門</a></li></ul></article></main></div></div>
