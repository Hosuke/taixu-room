    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 智顗（天台大師）</nav></header><main><article><h1>智顗（天台大師）</h1><p lang="zh-Hant">智顗</p><p>ちぎ</p><p>智顗（538–597）は慧思に師事したのち、南朝の都と天台山で教化した。『法華経』を中心に仏典を体系づけ、止と観を合わせた禅定の体系を築いた。『法華経』に関する講説と『摩訶止観』は弟子の灌頂により筆録・編集され、天台宗の根本典籍となった。</p><p>天台智者大師 · 隋 · 538-597</p><p>別称：智者大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T46n1911-%E6%91%A9%E8%A8%B6%E6%AD%A2%E8%A7%80/">摩訶止觀</a></li><li><a href="/ja/classics/cbeta-T-T33n1716-%E5%A6%99%E6%B3%95%E8%93%AE%E8%8F%AF%E7%B6%93%E7%8E%84%E7%BE%A9/">妙法蓮華經玄義</a></li><li><a href="/ja/classics/cbeta-T-T34n1718-%E5%A6%99%E6%B3%95%E8%93%AE%E8%8F%AF%E7%B6%93%E6%96%87%E5%8F%A5/">妙法蓮華經文句</a></li><li><a href="/ja/classics/cbeta-T-T46n1915-%E4%BF%AE%E7%BF%92%E6%AD%A2%E8%A7%80%E5%9D%90%E7%A6%AA%E6%B3%95%E8%A6%81/">修習止觀坐禪法要</a></li><li><a href="/ja/classics/cbeta-T-T34n1726-%E8%A7%80%E9%9F%B3%E7%8E%84%E7%BE%A9/">觀音玄義</a></li><li><a href="/ja/classics/cbeta-T-T39n1783-%E9%87%91%E5%85%89%E6%98%8E%E7%B6%93%E7%8E%84%E7%BE%A9/">金光明經玄義</a></li><li><a href="/ja/classics/cbeta-T-T46n1929-%E5%9B%9B%E6%95%99%E7%BE%A9/">四教義</a></li><li><a href="/ja/classics/cbeta-T-T46n1916-%E9%87%8B%E7%A6%AA%E6%B3%A2%E7%BE%85%E8%9C%9C%E6%AC%A1%E7%AC%AC%E6%B3%95%E9%96%80/">釋禪波羅蜜次第法門</a></li><li><a href="/ja/classics/cbeta-T-T40n1811-%E8%8F%A9%E8%96%A9%E6%88%92%E7%BE%A9%E7%96%8F/">菩薩戒義疏</a></li></ul></article></main></div></div>
