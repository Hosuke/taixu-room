    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 法蔵（賢首大師）</nav></header><main><article><h1>法蔵（賢首大師）</h1><p lang="zh-Hant">法藏</p><p>ほうぞう</p><p>法蔵（643–712）はソグド系の家に長安で生まれ、智儼に師事した。則天武后の支持を受けて『華厳経』を講じ、訳経事業にも参与した。その著作は一切の事象の相互依存を説き、仏の教えを五教に分類する。華厳宗は彼を第三祖とし、その『金師子章』は理と事の関係に関する華厳の説を例示している。</p><p>賢首法藏 · 唐 · 643-712</p><p>別称：賢首大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T45n1881-%E8%8F%AF%E5%9A%B4%E9%87%91%E5%B8%AB%E5%AD%90%E7%AB%A0%E4%BF%9D%E5%AD%97%E7%89%88/">華嚴金師子章</a></li><li><a href="/ja/classics/cbeta-T-T45n1866-%E8%8F%AF%E5%9A%B4%E4%B8%80%E4%B9%98%E6%95%99%E7%BE%A9%E5%88%86%E9%BD%8A%E7%AB%A0/">華嚴一乘教義分齊章</a></li><li><a href="/ja/classics/cbeta-T-T35n1733-%E8%8F%AF%E5%9A%B4%E7%B6%93%E6%8E%A2%E7%8E%84%E8%A8%98/">華嚴經探玄記</a></li><li><a href="/ja/classics/cbeta-T-T45n1876-%E4%BF%AE%E8%8F%AF%E5%9A%B4%E5%A5%A7%E6%97%A8%E5%A6%84%E7%9B%A1%E9%82%84%E6%BA%90%E8%A7%80/">修華嚴奧旨妄盡還源觀</a></li><li><a href="/ja/classics/cbeta-T-T44n1846-%E5%A4%A7%E4%B9%98%E8%B5%B7%E4%BF%A1%E8%AB%96%E7%BE%A9%E8%A8%98/">大乘起信論義記</a></li><li><a href="/ja/classics/cbeta-T-T40n1813-%E6%A2%B5%E7%B6%B2%E7%B6%93%E8%8F%A9%E8%96%A9%E6%88%92%E6%9C%AC%E7%96%8F/">梵網經菩薩戒本疏</a></li></ul></article></main></div></div>
