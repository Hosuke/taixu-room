    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 万松行秀</nav></header><main><article><h1>万松行秀</h1><p lang="zh-Hant">行秀</p><p>ばんしょうぎょうしゅう</p><p>万松行秀（1166–1246）は金代からモンゴル初期にかけて活動した曹洞宗の禅僧である。雪巌慧満に学び、華北の諸寺で教化した。宏智正覚の頌古百則に対する彼の評唱が『従容録』となった。</p><p>萬松行秀 · 金元 · 1166-1246</p><p>別称：萬松、萬松老人、報恩行秀、萬松野老</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T48n2004-%E8%90%AC%E6%9D%BE%E8%80%81%E4%BA%BA%E8%A9%95%E5%94%B1%E5%A4%A9%E7%AB%A5%E8%A6%BA%E5%92%8C%E5%B0%9A%E9%A0%8C%E5%8F%A4%E5%BE%9E%E5%AE%B9%E5%BA%B5%E9%8C%84/">萬松老人評唱天童覺和尚頌古從容庵錄</a></li></ul></article></main></div></div>
