    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 百丈懐海</nav></header><main><article><h1>百丈懐海</h1><p lang="zh-Hant">懷海</p><p>ひゃくじょうえかい</p><p>百丈懐海（720–814）は馬祖道一に学んだのち江西で教化した。その弟子には黄檗希運と潙山霊祐があり、後代の系譜は彼らを通じて臨済宗と潙仰宗をたどる。後世の清規は彼の権威を引くが、彼自身による完全な原本の規範は現存しない。</p><p>百丈懷海 · 唐 · 720-814</p><p>別称：百丈</p></article></main></div></div>
