    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 窺基（慈恩大師）</nav></header><main><article><h1>窺基（慈恩大師）</h1><p lang="zh-Hant">窺基</p><p>きき</p><p>窺基（632–682）は玄奘に師事し、長安でその訳場に加わった。大慈恩寺を拠点とし、慈恩大師として知られるようになった。『成唯識論』への注釈は、玄奘が伝えたインド瑜伽行諸説の総合を解説する。因明や『法華経』についても著述し、後代の法相の系統は彼を開祖と仰いだ。</p><p>慈恩窺基 · 唐 · 632-682</p><p>別称：慈恩大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T43n1830-%E6%88%90%E5%94%AF%E8%AD%98%E8%AB%96%E8%BF%B0%E8%A8%98%E5%8D%B7001a/">成唯識論述記</a></li><li><a href="/ja/classics/cbeta-T-T43n1831-%E6%88%90%E5%94%AF%E8%AD%98%E8%AB%96%E6%8E%8C%E4%B8%AD%E6%A8%9E%E8%A6%81/">成唯識論掌中樞要</a></li><li><a href="/ja/classics/cbeta-T-T43n1834-%E5%94%AF%E8%AD%98%E4%BA%8C%E5%8D%81%E8%AB%96%E8%BF%B0%E8%A8%98/">唯識二十論述記</a></li><li><a href="/ja/classics/cbeta-T-T45n1861-%E5%A4%A7%E4%B9%98%E6%B3%95%E8%8B%91%E7%BE%A9%E6%9E%97%E7%AB%A0/">大乘法苑義林章</a></li><li><a href="/ja/classics/cbeta-T-T44n1840-%E5%9B%A0%E6%98%8E%E5%85%A5%E6%AD%A3%E7%90%86%E8%AB%96%E7%96%8F/">因明入正理論疏</a></li></ul></article></main></div></div>
