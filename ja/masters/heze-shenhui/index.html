    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 荷沢神会</nav></header><main><article><h1>荷沢神会</h1><p lang="zh-Hant">神會</p><p>かたくじんね</p><p>荷沢神会（684–758）は慧能の系統を公然と擁護し、神秀に連なる師たちの主張を批判した。その活動は南宗と北宗の区別を確立する一因となった。のちに宗密は荷沢の伝統を継承し、禅に関する著述の中でその教えを論じている。</p><p>荷澤神會 · 唐 · 684-758</p><p>別称：荷澤</p></article></main></div></div>
