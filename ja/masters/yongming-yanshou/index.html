    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 永明延寿</nav></header><main><article><h1>永明延寿</h1><p lang="zh-Hant">延壽</p><p>ようみょうえんじゅ</p><p>永明延寿（904–975）は天台徳韶に師事し、杭州の永明寺の住持となった。百巻の『宗鏡録』は経典の引用と教理の論議を集成している。後代の禅と浄土の伝統はともに彼の遺産を継ぐと主張した。</p><p>永明延壽 · 五代宋初 · 904-975</p><p>別称：永明</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T48n2016-%E5%AE%97%E9%8F%A1%E9%8C%84/">宗鏡錄</a></li></ul></article></main></div></div>
