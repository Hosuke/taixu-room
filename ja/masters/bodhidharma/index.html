    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 菩提達磨（達磨大師）</nav></header><main><article><h1>菩提達磨（達磨大師）</h1><p lang="zh-Hant">達摩</p><p>ぼだいだるま</p><p>菩提達磨（五〜六世紀頃）について、初期の中国資料は禅定および『楞伽経』に関わる教えと結びつけている。後代の禅の系譜は彼を中国の初祖とし、慧可の師とする。『二入四行論』は彼に帰せられるが、その伝記の多くは後世の伝説に属する。</p><p>菩提達摩 · 南北朝 · c.5-6世紀</p><p>別称：達磨</p></article></main></div></div>
