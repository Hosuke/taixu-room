    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 陳那</nav></header><main><article><h1>陳那</h1><p lang="zh-Hant">陳那</p><p>じんな</p><p>陳那（約480–540）は瑜伽行派および仏教論理学の展開と結びつくインドの仏教思想家である。その著作は知覚・推論・認識対象を考察する。『観所縁論』をはじめとするその著作の漢訳は、東アジア仏教における識と論理の研究に寄与した。</p><p>陳那菩薩 · 印度 · 約480-540</p><p>別称：大域龍</p></article></main></div></div>
