    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 金剛智</nav></header><main><article><h1>金剛智</h1><p lang="zh-Hant">金剛智</p><p>こんごうち</p><p>金剛智（671–741）はスリランカと東南アジアを経る海路をたどり、720年に中国に至ったインド僧である。長安で密教経典を翻訳し、金剛頂経系と金剛界に関わる灌頂と儀礼の行法を伝えた。弟子の不空がこれを補佐し、師の没後もその事業を継いだ。善無畏・不空とともに開元の三大士の一人として知られる。</p><p>金剛智三藏 · 唐 · 671-741</p></article></main></div></div>
