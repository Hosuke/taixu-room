    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 無著</nav></header><main><article><h1>無著</h1><p lang="zh-Hant">無著</p><p>むじゃく</p><p>無著（4–5世紀頃）はインド瑜伽行派の形成と菩薩道に関する論書に結びつけられる人物である。『摂大乗論』や『大乗阿毘達磨集論』が彼に帰せられる。世親との関係は、後世の瑜伽行派の系譜叙述の中心をなす。</p><p>無著菩薩 · 印度 · 約4-5世紀</p><p>別称：阿僧伽</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T30n1565-%E9%A0%86%E4%B8%AD%E8%AB%96/">順中論</a></li><li><a href="/ja/classics/cbeta-T-T31n1605-%E5%A4%A7%E4%B9%98%E9%98%BF%E6%AF%98%E9%81%94%E7%A3%A8%E9%9B%86%E8%AB%96/">大乘阿毘達磨集論</a></li></ul></article></main></div></div>
