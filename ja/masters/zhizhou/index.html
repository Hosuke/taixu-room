    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 智周</nav></header><main><article><h1>智周</h1><p lang="zh-Hant">智周</p><p>ちしゅう</p><p>智周（678–733）は慧沼に師事し、窺基に連なる法相の教えを継承した。その『成唯識論演秘』は『成唯識論』の注釈伝統における難解な箇所を解説する。後世の記録は彼を慈恩宗の第三祖と認めている。</p><p>濮陽智周 · 唐 · 678-733</p><p>別称：濮陽、濮陽大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T43n1833-%E6%88%90%E5%94%AF%E8%AD%98%E8%AB%96%E6%BC%94%E7%A5%95/">成唯識論演祕</a></li></ul></article></main></div></div>
