    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 雲棲袾宏（蓮池大師）</nav></header><main><article><h1>雲棲袾宏（蓮池大師）</h1><p lang="zh-Hant">祩宏</p><p>うんせいしゅこう</p><p>雲棲袾宏（1535–1615）は杭州近郊の雲棲寺を再興し、僧団の規律と阿弥陀仏の称名を推進した。『阿弥陀経』への注釈や、その規約と勧誡の書は、出家と在家双方の実践を対象としている。</p><p>蓮池祩宏 · 明 · 1535-1615</p><p>別称：蓮池大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-X-X22n0424-%E9%98%BF%E5%BD%8C%E9%99%80%E7%B6%93%E7%96%8F%E9%88%94/">阿彌陀經疏鈔</a></li><li>竹窗隨筆</li><li><a href="/ja/classics/cbeta-J-J32nB277-%E9%9B%B2%E6%A3%B2%E6%B3%95%E5%BD%99%E9%81%B8%E9%8C%84%E8%AB%B8%E7%B6%93%E6%97%A5%E8%AA%A6%E9%9B%86%E8%A6%81/">雲棲法彙（選錄）</a></li><li><a href="/ja/classics/cbeta-T-T48n2024-%E7%A6%AA%E9%97%9C%E7%AD%96%E9%80%B2/">禪關策進</a></li></ul></article></main></div></div>
