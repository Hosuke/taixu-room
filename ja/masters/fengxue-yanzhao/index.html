    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 風穴延沼</nav></header><main><article><h1>風穴延沼</h1><p lang="zh-Hant">延沼</p><p>ふけつえんしょう</p><p>風穴延沼（897–973）は汝州の風穴寺の禅僧である。伝統的な記述では南院慧顒の後に置かれ、臨済の法系における後継者を首山省念とする。</p><p>風穴延沼 · 北宋 五代十國 · 897-973</p><p>別称：風穴沼、風穴、延昭、汝州風穴延沼</p></article></main></div></div>
