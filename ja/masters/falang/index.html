    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 法朗</nav></header><main><article><h1>法朗</h1><p lang="zh-Hant">法朗</p><p>ほうろう</p><p>法朗（507–581）は興皇寺にゆかりのある六世紀中国の三論宗の学僧である。僧詮から教えを受け、これを吉蔵に伝えた。三論の系譜における彼の位置は、大蔵経に現存する著作によってではなく、その講説と弟子たちに関する記録を通じて伝えられている。</p><p>興皇法朗 · 梁陳 · 507-581</p><p>別称：興皇、興皇大師</p></article></main></div></div>
