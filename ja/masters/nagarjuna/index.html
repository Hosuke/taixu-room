    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 龍樹</nav></header><main><article><h1>龍樹</h1><p lang="zh-Hant">龍樹</p><p>りゅうじゅ</p><p>龍樹の『中論』は、空の教えによって因果・同一性などの諸範疇を分析する。その著作はインドの中観派および中国の三論教学の中心となった。後世の禅の系譜では西天第十四祖とされる。</p><p>龍樹大士 · 印度</p><p>別称：龍樹菩薩</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T25n1509-%E5%A4%A7%E6%99%BA%E5%BA%A6%E8%AB%96/">大智度論</a></li><li><a href="/ja/classics/cbeta-T-T30n1566-%E8%88%AC%E8%8B%A5%E7%87%88%E8%AB%96%E9%87%8B/">般若燈論釋</a></li><li><a href="/ja/classics/cbeta-T-T30n1565-%E9%A0%86%E4%B8%AD%E8%AB%96/">順中論</a></li><li><a href="/ja/classics/cbeta-T-T32n1631-%E8%BF%B4%E8%AB%8D%E8%AB%96/">迴諍論</a></li><li><a href="/ja/classics/cbeta-T-T30n1575-%E5%85%AD%E5%8D%81%E9%A0%8C%E5%A6%82%E7%90%86%E8%AB%96/">六十頌如理論</a></li></ul></article></main></div></div>
