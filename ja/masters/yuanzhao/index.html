    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 霊芝元照</nav></header><main><article><h1>霊芝元照</h1><p lang="zh-Hant">元照</p><p>れいしがんじょう</p><p>霊芝元照（1048–1116）は北宋の南山律宗の学僧である。霊芝崇福寺をはじめ諸寺に住し、浄土の行も提唱した。その『資持記』『行宗記』『済縁記』は、道宣の戒律に関する主要著作を解説したものである。</p><p>靈芝元照 · 北宋 · 1048-1116</p><p>別称：靈芝尊者、安忍子、大智律師、靈芝照</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-X-X41n0728-%E5%9B%9B%E5%88%86%E5%BE%8B%E5%88%AA%E8%A3%9C%E9%9A%A8%E6%A9%9F%E7%BE%AF%E7%A3%A8%E7%96%8F%E6%BF%9F%E7%B7%A3%E8%A8%98/">四分律刪補隨機羯磨疏濟緣記</a></li><li><a href="/ja/classics/cbeta-T-T40n1805-%E5%9B%9B%E5%88%86%E5%BE%8B%E8%A1%8C%E4%BA%8B%E9%88%94%E8%B3%87%E6%8C%81%E8%A8%98/">四分律行事鈔資持記</a></li></ul></article></main></div></div>
