    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 廬山慧遠</nav></header><main><article><h1>廬山慧遠</h1><p lang="zh-Hant">慧遠</p><p>ろざんえおん</p><p>廬山慧遠（334–416）は道安に師事したのち、廬山の東林寺に僧団を築いた。教理上の問題について鳩摩羅什と書簡を交わした。その僧団の阿弥陀仏念仏の実践により、後代の浄土の系譜は彼を初期の祖師に数える。</p><p>廬山慧遠 · 東晉 · 334-416</p><p>別称：遠公</p></article></main></div></div>
