    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 世親</nav></header><main><article><h1>世親</h1><p lang="zh-Hant">世親</p><p>せしん</p><p>世親（四〜五世紀頃）は『倶舎論』の本頌と注釈を著し、仏教教学の範疇と論証を検討した。その瑜伽行の教えに関わる著作には、識に関する『唯識二十論』と『唯識三十頌』があり、いずれも東アジアで広く研究された。</p><p>世親菩薩 · 印度 · c.4-5世紀</p><p>別称：天親</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T29n1558-%E4%BF%B1%E8%88%8D%E8%AB%96/">俱舍論</a></li><li><a href="/ja/classics/cbeta-T-T31n1597-%E6%94%9D%E5%A4%A7%E4%B9%98%E8%AB%96%E9%87%8BT31n1597/">攝大乘論釋（T31n1597）</a></li><li><a href="/ja/classics/cbeta-T-T31n1609-%E5%A4%A7%E4%B9%98%E6%88%90%E6%A5%AD%E8%AB%96/">大乘成業論</a></li><li><a href="/ja/classics/cbeta-T-T31n1612-%E5%A4%A7%E4%B9%98%E4%BA%94%E8%98%8A%E8%AB%96/">大乘五蘊論</a></li><li><a href="/ja/classics/cbeta-T-T26n1524-%E7%84%A1%E9%87%8F%E5%A3%BD%E7%B6%93%E5%84%AA%E6%B3%A2%E6%8F%90%E8%88%8D/">無量壽經優波提舍</a></li></ul></article></main></div></div>
