    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 吉蔵（嘉祥大師）</nav></header><main><article><h1>吉蔵（嘉祥大師）</h1><p lang="zh-Hant">吉藏</p><p>きちぞう</p><p>吉蔵（549–623）は建康の興皇寺で法朗に師事した。のちに会稽の嘉祥寺や長安の諸寺で教化し、三論宗の代表的論者となった。中観の三論に対する注釈や『二諦義』は、固定した思想的立場への執着を退ける。『法華経』『維摩経』『涅槃経』についても著述した。</p><p>嘉祥吉藏 · 隋唐 · 549-623</p><p>別称：嘉祥大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T42n1824-%E4%B8%AD%E8%A7%80%E8%AB%96%E7%96%8F/">中觀論疏</a></li><li><a href="/ja/classics/cbeta-T-T42n1827-%E7%99%BE%E8%AB%96%E7%96%8F/">百論疏</a></li><li><a href="/ja/classics/cbeta-T-T42n1825-%E5%8D%81%E4%BA%8C%E9%96%80%E8%AB%96%E7%96%8F/">十二門論疏</a></li><li><a href="/ja/classics/cbeta-T-T45n1852-%E4%B8%89%E8%AB%96%E7%8E%84%E7%BE%A9/">三論玄義</a></li><li><a href="/ja/classics/cbeta-T-T45n1853-%E5%A4%A7%E4%B9%98%E7%8E%84%E8%AB%96/">大乘玄論</a></li><li><a href="/ja/classics/cbeta-T-T45n1854-%E4%BA%8C%E8%AB%A6%E7%BE%A9/">二諦義</a></li></ul></article></main></div></div>
