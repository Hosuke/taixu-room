    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 義浄</nav></header><main><article><h1>義浄</h1><p lang="zh-Hant">義淨</p><p>ぎじょう</p><p>義浄（635–713）は室利仏逝を経て海路インドに赴き、那爛陀寺で学んだのち、695年に中国へ帰還した。その『南海寄帰内法伝』はインドと東南アジアの僧院生活を記す。その訳業には根本説一切有部律の大部分が含まれる。</p><p>義淨三藏 · 唐 · 635-713</p></article></main></div></div>
