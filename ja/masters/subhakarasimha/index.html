    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 善無畏</nav></header><main><article><h1>善無畏</h1><p lang="zh-Hant">善無畏</p><p>ぜんむい</p><p>善無畏（637–735）は716年に長安に至ったインド僧である。中国僧一行とともに『大日経』を翻訳し、その儀礼と観想の行法を講説した。一行が筆録したその講説の注釈は東アジア密教の中心的典籍となり、この経典に関わる教えは胎蔵界の伝統の基盤をなす。金剛智・不空とともに開元の三大士の一人として記憶されている。</p><p>善無畏三藏 · 唐 · 637-735</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T39n1796-%E5%A4%A7%E6%AF%98%E7%9B%A7%E9%81%AE%E9%82%A3%E6%88%90%E4%BD%9B%E7%B6%93%E7%96%8F/">大毘盧遮那成佛經疏</a></li><li><a href="/ja/classics/cbeta-T-T18n0850-%E6%94%9D%E5%A4%A7%E6%AF%98%E7%9B%A7%E9%81%AE%E9%82%A3%E6%88%90%E4%BD%9B%E7%A5%9E%E8%AE%8A%E5%8A%A0%E6%8C%81%E7%B6%93%E5%85%A5%E8%93%AE%E8%8F%AF%E8%83%8E%E8%97%8F%E6%B5%B7%E6%9C%83%E6%82%B2%E7%94%9F%E6%9B%BC%E8%8D%BC%E6%94%9E%E5%BB%A3%E5%A4%A7%E5%BF%B5%E8%AA%A6%E5%84%80%E8%BB%8C%E4%BE%9B%E9%A4%8A%E6%96%B9%E4%BE%BF%E6%9C%83/">攝大毘盧遮那成佛神變加持經入蓮華胎藏海會悲生曼荼攞廣大念誦儀軌供養方便會</a></li><li><a href="/ja/classics/cbeta-T-T18n0851-%E5%A4%A7%E6%AF%98%E7%9B%A7%E9%81%AE%E9%82%A3%E7%B6%93%E5%BB%A3%E5%A4%A7%E5%84%80%E8%BB%8C/">大毘盧遮那經廣大儀軌</a></li></ul></article></main></div></div>
