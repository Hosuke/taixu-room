    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 馬鳴</nav></header><main><article><h1>馬鳴</h1><p lang="zh-Hant">馬鳴</p><p>めみょう</p><p>馬鳴はサンスクリットの仏教詩を作り、仏陀の生涯を詠んだ『ブッダチャリタ（仏所行讃）』や、難陀の解脱への道を描く『サウンダラナンダ（端正なる難陀）』がある。後世の禅の系譜では西天第十二祖とされる。</p><p>馬鳴大士 · 印度</p></article></main></div></div>
