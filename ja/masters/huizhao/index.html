    <div id="root"><div data-prerender><header><nav><a href="/ja/">太虛間</a> › <a href="/ja/masters/">祖師</a> › 慧沼</nav></header><main><article><h1>慧沼</h1><p lang="zh-Hant">慧沼</p><p>えしょう</p><p>慧沼（648–714、通説）は中国法相宗において窺基の唯識解釈を継承した。その『成唯識論了義灯』は、『成唯識論』をめぐる対立する解釈に対して窺基の説を擁護する。次代では智周がその注釈の業を継いだ。没年は通説では714年とされるが、DILAが引く碑文に基づく再検討では726年から741年の間とされる。</p><p>淄州慧沼 · 唐 · 648-714（通說）</p><p>別称：惠沼、淄州、淄州大師</p><h2>著作と訳経</h2><ul><li><a href="/ja/classics/cbeta-T-T43n1832-%E6%88%90%E5%94%AF%E8%AD%98%E8%AB%96%E4%BA%86%E7%BE%A9%E7%87%88/">成唯識論了義燈</a></li></ul></article></main></div></div>
