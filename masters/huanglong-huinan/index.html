    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/masters/">祖師</a> › 慧南</nav></header><main><article><h1>慧南</h1><p>黃龍慧南 · 宋 · 1002-1069</p><p>宋代臨濟宗黃龍派祖師；v1 先列為五家七宗之一支。</p><p>別名：黃龍祖心慧南、黃龍派</p><p>所屬宗派：<a href="/zong/chan/">禪宗</a>、臨濟宗、黃龍派、五家七宗</p><p>義理：黃龍派、臨濟宗、五家七宗</p><h2>本師</h2><ul><li><a href="/masters/shishuang-chuyuan/">楚圓</a> — 五家七宗之黃龍派。</li></ul><p>相關祖師：<a href="/masters/yangqi-fanghui/">方會</a></p><p>傳略來源：人名規範：DILA 人名規範 A003921。傳記來源：見原註；未逐條落僧傳卷次者仍待補。。法脈來源：五燈會元（traditional）。原註：生卒、別名與黃龍慧南略傳據 DILA Authority A003921；黃龍派法脈另據《五燈會元》卷十七 refs。</p></article></main></div></div>
