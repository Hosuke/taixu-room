    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/masters/">祖師</a> › 德清</nav></header><main><article><h1>德清</h1><p>憨山德清 · 明 · 1546-1623</p><p>德清為晚明高僧，以禪教會通、經疏直解著稱。太虛間今先收其般若、圓覺、楞嚴、楞伽、法華諸疏；《憨山老人夢遊集》可作待入庫之文集與傳記來源。</p><p>別名：憨山、憨山大師</p><h2>著述與譯本</h2><ul><li><a href="/classics/cbeta-X-X26n0542-%E8%88%AC%E8%8B%A5%E5%BF%83%E7%B6%93%E7%9B%B4%E8%AA%AA%E4%BF%9D%E5%AD%97%E7%89%88/">般若心經直說</a></li><li><a href="/classics/cbeta-X-X25n0474-%E9%87%91%E5%89%9B%E7%B6%93%E6%B1%BA%E7%96%91%E4%BF%9D%E5%AD%97%E7%89%88/">金剛經決疑</a></li><li><a href="/classics/cbeta-X-X10n0258-%E5%9C%93%E8%A6%BA%E7%B6%93%E7%9B%B4%E8%A7%A3/">圓覺經直解</a></li><li><a href="/classics/cbeta-X-X12n0279-%E6%A5%9E%E5%9A%B4%E7%B6%93%E9%80%9A%E8%AD%B0%E4%BF%9D%E5%AD%97%E7%89%88%E5%8D%B71/">楞嚴經通議</a></li><li><a href="/classics/cbeta-X-X17n0326-%E8%A7%80%E6%A5%9E%E4%BC%BD%E7%B6%93%E8%A8%98%E4%BF%9D%E5%AD%97%E7%89%88%E5%8D%B71/">觀楞伽經記</a></li><li><a href="/classics/cbeta-X-X31n0611-%E6%B3%95%E8%8F%AF%E7%B6%93%E9%80%9A%E7%BE%A9%E4%BF%9D%E5%AD%97%E7%89%88%E5%8D%B71/">法華經通義</a></li><li><a href="/classics/cbeta-X-X73n1456-%E6%86%A8%E5%B1%B1%E8%80%81%E4%BA%BA%E5%A4%A2%E9%81%8A%E9%9B%86%E5%8D%B7001/">憨山老人夢遊集</a></li></ul></article></main></div></div>
