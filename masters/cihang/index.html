    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/masters/">祖師</a> › 慈航</nav></header><main><article><h1>慈航</h1><p>慈航法師 · 近代 · 1893-1954</p><p>近代佛教教育人物，與太虛法脈相關，台灣佛學教育早期重鎮。</p><p>所屬宗派：人間佛教、近代佛教</p><p>義理：佛教教育</p><p>相關祖師：<a href="/masters/yinshun/">印順</a></p><p>傳略來源：人名規範：DILA 人名規範 A019748。傳記來源：見原註；未逐條落僧傳卷次者仍待補。。法脈來源：太虛間太虛學派 registry／DILA 人名規範（documented）。原註：生卒、別名與慈航法師略傳據 DILA Authority A019748；近代僧教育與臺灣佛教關聯另待補專傳來源。</p></article></main></div></div>
