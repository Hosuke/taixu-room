    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/masters/">祖師</a> › 空海</nav></header><main><article><h1>空海</h1><p>弘法大師空海 · 日本平安 · 774-835</p><p>讚岐人，804 年隨遣唐使入唐，805 年於長安青龍寺盡受惠果兩部大法，806 年歸國開真言宗（東密），816 年開高野山；奉淳和天皇敕撰《十住心論》十卷，立十住心判教，攝顯密於一綱。</p><p>別名：遍照金剛、佐伯真魚</p><h2>著述與譯本</h2><ul><li><a href="/classics/kukai-shijushinron-v01/">秘密曼荼羅十住心論</a></li><li><a href="/classics/ndl-kukai-sokushin-jobutsugi/">即身成佛義</a></li><li>理趣經開題諸本</li><li><a href="/classics/cbeta-T-T55n2161-%E5%BE%A1%E8%AB%8B%E4%BE%86%E7%9B%AE%E9%8C%84/">御請來目錄</a></li><li><a href="/classics/ndl-kukai-benkenmitsu-%E5%8D%B7%E4%B8%8A/">辯顯密二教論</a></li><li><a href="/classics/ndl-kukai-dainichikyosho-yomonki/">大日經疏要文記</a></li><li><a href="/classics/ndl-kukai-daisho-mon-shidai/">大毘盧遮那成佛經疏文次第</a></li><li><a href="/classics/ndl-kukai-hannya-shingyo-hiken/">般若心經秘鍵</a></li><li><a href="/classics/ndl-kukai-hizohoyaku-%E5%8D%B7%E4%B8%8A/">秘藏寶鑰</a></li><li><a href="/classics/ndl-kukai-shakuron-shiji-%E5%8D%B7%E4%B8%8A/">釋摩訶衍論指事</a></li><li><a href="/classics/ndl-kukai-shoji-jissogi/">聲字實相義</a></li><li><a href="/classics/ndl-kukai-unjigi/">吽字義</a></li></ul></article></main></div></div>
