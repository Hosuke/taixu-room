    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/book/">注書</a> › 帛書老子杳眇注</nav></header><main><article><h1>帛書老子杳眇注</h1><p>杳眇 · 德經四十四章，道經三十七章</p><p>杳眇注者，以帛書校勘版為底本，王弼本為對校，德先道後，復老子之舊制。凡八十一章，章三層——原文、對校、疏。疏之為體，文言四五百言，不煩考據，唯點出帛王之異、儒道之通、言教之外。辨无／無、正／貞、兼／廉、右介／左契、畏畏／畏威、免成／晚成、賢貴生／賢於貴生、竽／夸、始／貸諸關要字義；引斯文文庫諸條為 wikilink，使讀者遊網而讀，非線性而讀。</p></article></main></div></div>
