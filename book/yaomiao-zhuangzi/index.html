    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/book/">注書</a> › 南華經杳眇注</nav></header><main><article><h1>南華經杳眇注</h1><p>杳眇 · 內七、外十五、雜十一——三十三篇全</p><p>杳眇注南華者，承帛書老子注之體，辨莊周本義與郭象注之異——尤於逍遙、齊物、坐忘、心齋諸關目，復其無待之旨。凡三十三篇——內七、外十五、雜十一——章三層：南華原文、古注要錄、杳眇注。疏之為體，文言不限字數，兼示內外雜之別、莊禪之通、俗讀之失、偽篇之辨（讓王、盜跖、說劍、漁父等）。引斯文文庫諸條為 wikilink，使讀者遊網而讀。</p></article></main></div></div>
