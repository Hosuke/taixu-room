    <circle cx="32" cy="32" r="15.52" fill="none" stroke="#FEFEFC" stroke-width="4.8"/>
    <rect x="29.28" y="0" width="5.44" height="64" fill="#1E3A5F"/>
    <rect x="31.04" y="0" width="1.92" height="64" fill="#FEFEFC"/>
  </g>
  <rect x="0.38" y="0.38" width="63.24" height="63.24" rx="3.46" fill="none" stroke="#0F2540" stroke-width="0.77"/>
  <rect x="3.84" y="3.84" width="56.32" height="56.32" rx="1.92" fill="none" stroke="#FEFEFC" stroke-opacity=".35" stroke-width="0.32"/>
</svg>
