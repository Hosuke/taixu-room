    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 荃提</nav></header><main><article><h1>荃提</h1><p>荃，謂荃草，出崑崙山。</p><p>《翻譯名義集》卷三〈林木篇第三十一〉釋曰：</p><p>&gt; 【荃提】荃，謂荃草，出崑崙山。提，謂可遷徙提挈也。見《經音義》。</p><p><strong>所出</strong>：《翻譯名義集》卷三〈林木篇第三十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1102b29</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E4%BC%8A%E8%98%AD/">伊蘭</a></li><li><a href="/wiki/%E5%A4%9A%E7%BE%85/">多羅</a></li><li><a href="/wiki/%E5%A8%91%E7%BE%85/">娑羅</a></li><li><a href="/wiki/%E5%A9%86%E9%82%A3/">婆那</a></li><li><a href="/wiki/%E5%B0%B8%E5%88%A9%E6%B2%99/">尸利沙</a></li><li><a href="/wiki/%E5%B0%B8%E9%99%80/">尸陀</a></li><li><a href="/wiki/%E5%B0%BC%E6%8B%98%E5%BE%8B%E9%99%80/">尼拘律陀</a></li><li><a href="/wiki/%E5%BD%88%E5%A4%9A%E6%8A%B3%E7%91%9F%E6%90%8B/">彈多抳瑟搋</a></li><li><a href="/wiki/%E6%9B%B3%E7%91%9F%E7%9F%A5%E6%9E%97/">曳瑟知林</a></li><li><a href="/wiki/%E6%B3%A2%E5%90%92%E9%87%90/">波吒釐</a></li><li><a href="/wiki/%E7%95%A2%E5%88%A9%E5%8F%89/">畢利叉</a></li><li><a href="/wiki/%E8%8F%A9%E6%8F%90%E6%A8%B9/">菩提樹</a></li></ul></section></article></main></div></div>
