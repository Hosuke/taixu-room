    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 莊嚴非莊嚴</nav></header><main><article><h1>莊嚴非莊嚴</h1><p>莊嚴佛土者，則非莊嚴，是名莊嚴也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：[[阿羅漢]]莊嚴佛土不？答言不也。莊嚴佛土者，則非莊嚴，是名莊嚴。是故[[阿羅漢]]應離一切相，發[[無上正遍覺]]心。此[[無住布施]]之延伸義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
