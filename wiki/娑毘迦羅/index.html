    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 娑毘迦羅</nav></header><main><article><h1>娑毘迦羅</h1><p>亦云劫毘羅。</p><p>《翻譯名義集》卷二〈外道篇第十九〉釋曰：</p><p>&gt; 【娑毘迦羅】亦云劫毘羅。此云金頭或云黃髮，食米臍外道。應法師云：「舊言食米屑也。外道修苦行，合手大指，及第三指，以物縛之。往至人家舂穀簸（補過）米處，以彼縛指，拾取米屑。聚至掌中，隨得多少，去以為食。若全粒者，即不取之。亦名䳕（音孚）鳩行，外道拾米，如䳕鳩行也。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈外道篇第十九〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1084b18</p></article></main></div></div>
