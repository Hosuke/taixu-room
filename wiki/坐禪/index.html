    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 坐禪</nav></header><main><article><h1>坐禪</h1><p>三千威儀經云。坐禪有十事。</p><p>《釋氏要覽》卷下〈躁靜〉釋曰：</p><p>&gt; 三千威儀經云。坐禪有十事。一．當隨時。謂四時也。二．得安床。謂禪床也。三．軟座。毛座也。四．閑處。謂山間樹下也。五．得善知識謂好伴也。六．善檀越。謂不外求也。七．善意謂能觀也。八．善藥謂伏意也。九．能服藥。謂不念萬物也。十．得善助。謂畜禪帶也。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈躁靜〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0297a25</p></article></main></div></div>
