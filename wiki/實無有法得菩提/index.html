    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 實無有法得菩提</nav></header><main><article><h1>實無有法得菩提</h1><p>[[如來]]於然燈佛所，於法實無所得；實無有法[[如來]]得[[無上正遍覺]]也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：如來昔在然燈佛所，於法有所得不？答言實無所得。如來又問：若有人言如來得[[無上正遍覺]]，實無有法，佛得[[無上正遍覺]]。若有法，如來得[[無上正遍覺]]者，然燈佛則不與我受記。此[[四果無得]]之究竟說，[[依法不依人]]之極證也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
