    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 眾生</nav></header><main><article><h1>眾生</h1><p>梵云僕呼善那。此云眾生謂眾緣所生故○祐法師云。</p><p>《釋氏要覽》卷中〈界趣〉釋曰：</p><p>&gt; 梵云僕呼善那。此云眾生謂眾緣所生故○祐法師云。眾共生世。故名眾生○唐三藏譯名有情。謂一切無情物。皆假眾緣生。今簡去無情。故云有情○證契大乘經云。眾生者何義。佛言。是情想和合。所謂地水火風空識名色界入緣起及因業果會對而生故○楞伽經云。一切眾無明為根本。於愛隨業流運。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈界趣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0292b21</p></article></main></div></div>
