    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 茶矩磨</nav></header><main><article><h1>茶矩磨</h1><p>此云欝金。</p><p>《翻譯名義集》卷三〈眾香篇三十四〉釋曰：</p><p>&gt; 【茶矩磨】此云欝金。《周禮．春官》「欝人采取以鬯酒。」《說文》云：「欝金草之華，遠方所貢芳物。欝人合而釀之，以降神也，宗廟用之。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈眾香篇三十四〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1105a12</p></article></main></div></div>
