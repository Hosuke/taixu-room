    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 僧次</nav></header><main><article><h1>僧次</h1><p>鈔云。寺中差僧訃請而簡客者。</p><p>《釋氏要覽》卷下〈住持〉釋曰：</p><p>&gt; 鈔云。寺中差僧訃請而簡客者。翻名越（次此）住處不得名僧。以簡客主非和同義故。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈住持〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0302b25</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E4%B8%BB%E4%BA%8B%E5%9B%9B%E5%93%A1/">主事四員</a></li><li><a href="/wiki/%E4%BC%BD%E8%97%8D%E7%AB%8B%E5%BB%9F/">伽藍立廟</a></li><li><a href="/wiki/%E4%BE%8D%E8%80%85/">侍者</a></li><li><a href="/wiki/%E5%83%A7%E4%BD%BF/">僧使</a></li><li><a href="/wiki/%E5%87%BA%E5%8A%9B%E6%AF%94%E4%B8%98/">出力比丘</a></li><li><a href="/wiki/%E5%8D%81%E6%96%B9%E4%BD%8F%E6%8C%81/">十方住持</a></li><li><a href="/wiki/%E5%AE%88%E5%AF%BA%E6%AF%94%E4%B8%98/">守寺比丘</a></li><li><a href="/wiki/%E5%B8%B8%E4%BD%8F/">常住</a></li><li><a href="/wiki/%E5%BE%8B%E4%BD%8F%E6%8C%81/">律住持</a></li><li><a href="/wiki/%E6%85%B3%E6%83%9C%E5%83%A7%E7%89%A9%E6%83%A1%E5%A0%B1/">慳惜僧物惡報</a></li><li><a href="/wiki/%E6%93%AF%E6%B2%BB/">擯治</a></li><li><a href="/wiki/%E6%99%AE%E8%AB%8B/">普請</a></li></ul></section></article></main></div></div>
