    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 阿伽嚧</nav></header><main><article><h1>阿伽嚧</h1><p>或云惡揭嚕，此云沈香。</p><p>《翻譯名義集》卷三〈眾香篇三十四〉釋曰：</p><p>&gt; 【阿伽嚧】或云惡揭嚕，此云沈香。《華嚴》云：「阿那婆達多池邊，出沈水香，名蓮華藏。其香一圓，如麻子大。若以燒之，香氣普熏閻浮提界。」《異物誌》云：「出日南國。欲取，當先斫樹壞，著地積久，外朽爛。其心堅者，置水則沈，曰沈香。其次在心白之間，不甚精堅者，置之水中，不沈不浮，與水平者，名曰𣝕香。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈眾香篇三十四〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1105a04</p></article></main></div></div>
