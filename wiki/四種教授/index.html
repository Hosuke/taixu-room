    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 四種教授</nav></header><main><article><h1>四種教授</h1><p>【一無倒教授】謂不顛倒宣說法義令其受持讀誦脩學是名無倒教授。</p><p>《大明三藏法數》卷十釋曰（出瑜伽師地論）：</p><p>&gt; 【一無倒教授】謂不顛倒宣說法義令其受持讀誦脩學是名無倒教授。
&gt;
&gt; 【二漸次教授】謂稱其根機宣說法義先教習小後令入大是名漸次教授。
&gt;
&gt; 【三教教授】謂或從如來或從佛弟子所聞正教即如其教不增不減教授他人是名教教授。
&gt;
&gt; 【四證教授】謂自己所證之法為欲令他得證方便教授是名證教授。</p><p><strong>所出</strong>：《大明三藏法數》卷十 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0747a03</p></article></main></div></div>
