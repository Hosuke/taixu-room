    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 非眾生非不眾生</nav></header><main><article><h1>非眾生非不眾生</h1><p>彼非眾生，非不眾生；眾生、眾生者，[[如來]]說非眾生，是名眾生也。</p><p>[[阿羅漢]][[須菩提]]問[[如來]]：頗有眾生於未來世，聞說是法生信心不？佛言：彼非眾生，非不眾生。何以故？眾生、眾生者，如來說非眾生，是名眾生。此[[法與法性]]之圓融，[[依法不依人]]之深義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
