    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 一切法皆是佛法</nav></header><main><article><h1>一切法皆是佛法</h1><p>一切法皆是佛法，所言一切法者，即非一切法，是故名一切法也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：如來所得[[無上正遍覺]]，於是中無實無虛，是故[[如來]]說一切法皆是佛法。所言一切法者，即非一切法，是故名一切法。此[[法與法性]]之圓融，[[金剛般若]]之究竟義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
