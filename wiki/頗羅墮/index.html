    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 頗羅墮</nav></header><main><article><h1>頗羅墮</h1><p>姓也。</p><p>《翻譯名義集》卷一〈總諸聲聞篇第九〉釋曰：</p><p>&gt; 【頗羅墮】姓也。真諦云捷疾，亦云利根，或廣語。《本行集》翻重幢。婆羅門凡十八姓，此居其一。或云賓度羅跋羅墮闍。《感通傳》云：「今時有作賓頭盧聖僧像，立房供養，亦是一途。然須別施空座，前置椀鉢。至僧食時，令大僧為受，不得以僧家盤盂設之。以凡聖雖殊，俱不觸僧食器。若是俗家，則隨俗所設。」恐僧不知，附此編出。</p><p><strong>所出</strong>：《翻譯名義集》卷一〈總諸聲聞篇第九〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1064b04</p></article></main></div></div>
