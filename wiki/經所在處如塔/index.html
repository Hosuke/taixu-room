    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 經所在處如塔</nav></header><main><article><h1>經所在處如塔</h1><p>隨說是經乃至四句偈等，一切世間天、人、阿修羅皆應供奉，如佛塔廟也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：隨說是經，乃至四句偈等，當知此處，一切世間天、人、阿修羅皆應供奉，如佛塔廟。何況有人盡能受持讀誦？當知是人成就最上、第一、希有之法。若是經典所在之處，則為有[[如來]]，若尊重弟子。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
