    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 母六親</nav></header><main><article><h1>母六親</h1><p>【一舅】舅者即母之舅乃外祖母之兄弟於己為舅公也。</p><p>《大明三藏法數》卷二十釋曰（出善見毘婆沙律）：</p><p>&gt; 【一舅】舅者即母之舅乃外祖母之兄弟於己為舅公也。
&gt;
&gt; 【二姨】姨者即母之姨乃外祖母之姊妹於己為姨婆也。
&gt;
&gt; 【三兄】兄者即母之兄於己為舅也。
&gt;
&gt; 【四弟】弟者即母之弟於己亦為舅也。
&gt;
&gt; 【五兒】兒者即母之女於己為姊妹也。
&gt;
&gt; 【六孫】孫者即母之孫乃兄弟之子於己為姪女也。</p><p><strong>所出</strong>：《大明三藏法數》卷二十 — https://cbetaonline.dila.edu.tw/zh/P182n1615_p0237a09</p></article></main></div></div>
