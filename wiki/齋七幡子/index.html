    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 齋七幡子</nav></header><main><article><h1>齋七幡子</h1><p>北俗亡。累七。齋日。皆令主齋僧。</p><p>《釋氏要覽》卷下〈雜紀〉釋曰：</p><p>&gt; 北俗亡。累七。齋日。皆令主齋僧。剪帋幡子一首。隨帋化之。按正法念處經。有一十七種中有。謂死時。若生天者。即見中有如白㲲垂下。其人識神見已。舉手攬之。便受天人中有身。故今七七日。是中有死生之日。以白紙幡子勝幢之。相示之故此人招魂帛。皆用白練。甚合經旨也。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈雜紀〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0305c09</p></article></main></div></div>
