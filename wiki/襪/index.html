    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 襪</nav></header><main><article><h1>襪</h1><p>鈔云。襪亦是衣○四分律云。</p><p>《釋氏要覽》卷上〈法衣〉釋曰：</p><p>&gt; 鈔云。襪亦是衣○四分律云。寒聽着襪（古今注云。自三代及秦皆著角襪。以帶結至踝。洎魏文乃。更其樣釋名曰。襪未也。在脚未也。崔駟銘曰。建子之月。助養和氣）○五分律云。外道問衣。比丘不知。乃被譏曰。沙門有何奇特。尚不知衣相。云何知心。故於前文。委細註釋爾。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈法衣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0270c21</p></article></main></div></div>
