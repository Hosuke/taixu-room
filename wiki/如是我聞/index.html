    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 如是我聞</nav></header><main><article><h1>如是我聞</h1><p>經首之語，記佛說法時之所聞也。</p><p>[[阿羅漢]]之結集也，經首皆安「如是我聞」四字。明阿難所言，皆親從佛聞，非他杜造。此[[如來成所作事品]]所述「我承傳佛語」之意，亦[[依法不依人]]之義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E9%98%BF%E7%BE%85%E6%BC%A2/">阿羅漢</a></li><li><a href="/wiki/%E4%BE%9D%E6%B3%95%E4%B8%8D%E4%BE%9D%E4%BA%BA/">依法不依人</a></li><li><a href="/wiki/%E4%BD%9B%E6%BB%85%E5%BE%8C%E7%B5%90%E9%9B%86/">佛滅後結集</a></li></ul></section><section class="related"><h2>所出典籍</h2><ul><li><a href="/classics/%E9%87%91%E5%89%9B%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BE%85%E8%9C%9C%E7%B6%93/">金剛般若波羅蜜經</a></li></ul></section></article></main></div></div>
