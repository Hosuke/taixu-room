    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 如是我聞</nav></header><main><article><h1>如是我聞</h1><p>經首之語，記佛說法時之所聞也。</p><p>[[阿羅漢]]之結集也，經首皆安「如是我聞」四字。明阿難所言，皆親從佛聞，非他杜造。此[[如來成所作事品]]所述「我承傳佛語」之意，亦[[依法不依人]]之義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
