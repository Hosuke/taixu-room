    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二種無礙</nav></header><main><article><h1>二種無礙</h1><p>【一智慧於境無礙】境即法界之理也謂菩薩以平等智證於法界之理理事融通無有障礙故名智慧於境無礙。</p><p>《大明三藏法數》卷三釋曰（出華嚴經䟽）：</p><p>&gt; 【一智慧於境無礙】境即法界之理也謂菩薩以平等智證於法界之理理事融通無有障礙故名智慧於境無礙。
&gt;
&gt; 【二神通作用無礙】謂菩薩由內心證於法界之理故能以種種神通應現十方世界隨機化度皆無障礙故名神通作用無礙。</p><p><strong>所出</strong>：《大明三藏法數》卷三 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0498a04</p></article></main></div></div>
