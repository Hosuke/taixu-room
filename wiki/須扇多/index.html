    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 須扇多</nav></header><main><article><h1>須扇多</h1><p>亦云須扇頭，此云甚淨。</p><p>《翻譯名義集》卷一〈諸佛別名第二〉釋曰：</p><p>&gt; 【須扇多】亦云須扇頭，此云甚淨。弟子未熟，便入涅槃，留化佛一劫。</p><p><strong>所出</strong>：《翻譯名義集》卷一〈諸佛別名第二〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1058c17</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E4%BF%B1%E7%95%99%E5%AD%AB/">俱留孫</a></li><li><a href="/wiki/%E5%89%8C%E9%82%A3%E9%82%A3%E4%BC%BD%E7%BE%85/">剌那那伽羅</a></li><li><a href="/wiki/%E5%B0%B8%E6%A3%84/">尸棄</a></li><li><a href="/wiki/%E5%BC%97%E6%B2%99/">弗沙</a></li><li><a href="/wiki/%E5%BD%8C%E5%8B%92/">彌勒</a></li><li><a href="/wiki/%E6%8B%98%E9%82%A3%E5%90%AB%E7%89%9F%E5%B0%BC/">拘那含牟尼</a></li><li><a href="/wiki/%E6%8F%90%E5%92%8C%E7%BE%85%E8%80%B6/">提和羅耶</a></li><li><a href="/wiki/%E6%8F%90%E6%B4%B9%E7%AB%AD/">提洹竭</a></li><li><a href="/wiki/%E6%9B%87%E6%91%A9%E8%BF%A6/">曇摩迦</a></li><li><a href="/wiki/%E6%A8%93%E5%A4%B7%E4%BA%98%E7%BE%85/">樓夷亘羅</a></li><li><a href="/wiki/%E6%A8%93%E8%87%B3/">樓至</a></li><li><a href="/wiki/%E6%AF%98%E5%A9%86%E5%B0%B8/">毘婆尸</a></li></ul></section></article></main></div></div>
