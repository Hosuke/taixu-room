    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 非微塵非世界</nav></header><main><article><h1>非微塵非世界</h1><p>諸微塵如來說非微塵，是名微塵；如來說世界，非世界，是名世界也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：三千大千世界所有微塵是為多不？答言甚多。如來說非微塵，是名微塵。如來說世界，非世界，是名世界。此[[一切法皆是佛法]]之微觀解讀，[[法與法性]]之深析也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
