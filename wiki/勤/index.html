    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 勤</nav></header><main><article><h1>勤</h1><p>謂正勤也有四焉。即四種精進遮。</p><p>《釋氏要覽》卷中〈勤懈〉釋曰：</p><p>&gt; 謂正勤也有四焉。即四種精進遮。二不善法。集。二善法。謂已生不善法令斷。未生者令不生故。未生善令生。已生者令增長故。○智度論云。四種精進心。勇。發。動。畏。錯誤故。言正勤也○順正理論云。無始時來所以不能見四聖諦。都由懈怠。勤能治彼。令樂聽聞。如理思惟。四聖諦理。速證菩提。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈勤懈〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0283a10</p></article></main></div></div>
