    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 食量</nav></header><main><article><h1>食量</h1><p>增一阿含經云。若過分飽食。</p><p>《釋氏要覽》卷上〈中食〉釋曰：</p><p>&gt; 增一阿含經云。若過分飽食。則氣急身滿。百脈不調。令心壅塞。坐臥不安。若限少食。則身羸心懸。意慮無固。偈云。多食致苦患。少食氣力衰。處中而食者。如秤無高下○經云。多食人有五苦。一大便數。二小便數。三多睡。四身重不堪修業。五多患不消化○大薩遮經偈云。噉食太過人。身重多懈怠。現在未來世。於身失大利。睡眠自受苦。亦惱於他人。迷悶難𮄔窹。應時籌量食。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈中食〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0275a04</p></article></main></div></div>
