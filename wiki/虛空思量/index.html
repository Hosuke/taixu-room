    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 虛空思量</nav></header><main><article><h1>虛空思量</h1><p>以[[如來]]虛空不可思量，喻無住布施之福德也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：東方虛空可思量不？南、西、北方、四維、上、下虛空可思量不？答言不也。如是無住相布施，福德亦復如是不可思量。此[[無住布施]]功德之喻也。</p><p><strong>所出</strong>：《金剛般波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
