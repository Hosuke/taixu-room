    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 天趣</nav></header><main><article><h1>天趣</h1><p>毘婆沙論云。諸趣最勝故光明照耀故。</p><p>《釋氏要覽》卷中〈界趣〉釋曰：</p><p>&gt; 毘婆沙論云。諸趣最勝故光明照耀故。名天也○智度論云有四種天。一生天。謂四天王等已上天也。二名天謂今國王稱天子。三淨天。謂人中生諸聖人。四生淨天。即上界生諸聖人也。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈界趣〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0291a23</p></article></main></div></div>
