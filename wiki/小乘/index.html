    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 小乘</nav></header><main><article><h1>小乘</h1><p>小者。簡非大也。謂。如來觀根逗機。</p><p>《釋氏要覽》卷中〈三寶〉釋曰：</p><p>&gt; 小者。簡非大也。謂。如來觀根逗機。方便施設也○文殊問經。文殊白佛言。世尊入涅槃後。未來弟子。云何諸部分別。佛言未來我弟子。有二十部。能令諸法住。並得四果。三藏平等無下中。上譬如海水。味無有異。如人有二十子。真實如來所說。根本二部。從大乘出。從般若波羅蜜出。聲聞。緣覺。諸佛皆從般若波羅蜜多出故。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈三寶〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0285b17</p></article></main></div></div>
