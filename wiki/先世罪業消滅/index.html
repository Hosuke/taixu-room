    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 先世罪業消滅</nav></header><main><article><h1>先世罪業消滅</h1><p>受持讀誦此經，若為人輕賤，先世罪業則為消滅也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：善男子、善女人受持讀誦此經，若為人輕賤，是人先世罪業應墮惡道，以今世人輕賤故，先世罪業則為消滅，當得[[無上正遍覺]]。此[[經法所出]]之殊勝功德，[[依法不依人]]之驗證也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
