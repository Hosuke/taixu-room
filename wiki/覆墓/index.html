    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 覆墓</nav></header><main><article><h1>覆墓</h1><p>殯後三日。再往墓所。謂之覆墓。</p><p>《釋氏要覽》卷下〈送終〉釋曰：</p><p>&gt; 殯後三日。再往墓所。謂之覆墓。杜氏云。不載禮經但以孝子自迁奉後追慕所親。又慮墳墓未完復往省之。今釋子往亦無咎。蓋檢校之至也。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈送終〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0309c12</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E5%88%9D%E4%BA%A1/">初亡</a></li><li><a href="/wiki/%E5%8F%97%E5%BC%94/">受弔</a></li><li><a href="/wiki/%E5%93%AD/">哭</a></li><li><a href="/wiki/%E5%94%B1%E8%A1%A3/">唱衣</a></li><li><a href="/wiki/%E5%95%8F%E5%A2%B3%E5%A1%9A%E9%96%93%E7%B2%BE%E7%A5%9E%E6%9C%89%E7%84%A1/">問墳塚間精神有無</a></li><li><a href="/wiki/%E5%A5%94%E5%96%AA/">奔喪</a></li><li><a href="/wiki/%E5%AE%89%E9%BE%95%E6%9F%A9/">安龕柩</a></li><li><a href="/wiki/%E5%AF%92%E9%A3%9F%E4%B8%8A%E5%A2%93/">寒食上墓</a></li><li><a href="/wiki/%E5%BF%8C%E6%97%A5/">忌日</a></li><li><a href="/wiki/%E6%8C%87%E6%9E%9C/">指果</a></li><li><a href="/wiki/%E6%9C%8D%E5%88%B6/">服制</a></li><li><a href="/wiki/%E6%9D%96/">杖</a></li></ul></section></article></main></div></div>
