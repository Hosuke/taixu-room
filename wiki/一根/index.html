    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 一根</nav></header><main><article><h1>一根</h1><p>一根即耳根也盖由此方之人耳根最利聞法易入故文殊選揀圓通之門取耳根為第一也然以耳根為圓通門者特假其通入而已必期脫去聲塵……</p><p>《大明三藏法數》卷一釋曰（出楞嚴經）：</p><p>&gt; 一根即耳根也盖由此方之人耳根最利聞法易入故文殊選揀圓通之門取耳根為第一也然以耳根為圓通門者特假其通入而已必期脫去聲塵反聞自性然後為復本歸源之至一根既然諸根亦寂經云一根既返源六根成解脫是也（六根者眼根耳根鼻根舌根身根意根也）。</p><p><strong>所出</strong>：《大明三藏法數》卷一 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0425a06</p></article></main></div></div>
