    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 命終心</nav></header><main><article><h1>命終心</h1><p>唯識鈔云命終心起四種愛。</p><p>《釋氏要覽》卷下〈贍病〉釋曰：</p><p>&gt; 唯識鈔云命終心起四種愛。即一切有情善惡。受身之根本也。一者。於其自身。起現有愛。二者。於現眷屬。起貪喜俱行愛。三者。於現田宅資生業。起彼彼喜樂愛。四者。於當來生。起後有愛。且四愛中。前三是助潤生。後一是正潤生。謂於當來生地起故。亦名受生心。此心位。若得人善巧策發。聞佛名磬聲。令專繫聖境。以不顛倒故。必隨願往生善趣。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈贍病〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0307a07</p></article></main></div></div>
