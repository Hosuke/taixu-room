    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 三等出家人</nav></header><main><article><h1>三等出家人</h1><p>三千威儀經云。出家行。有始終上中下業。</p><p>《釋氏要覽》卷上〈出家〉釋曰：</p><p>&gt; 三千威儀經云。出家行。有始終上中下業。下者。以十戒為本。盡形壽受持。雖捨家緣。執作與俗人等。中者應捨作務。具受八萬四千向道因緣。身口意業。未能具足。清淨。心結猶存。未能出離。比上不足。比下有餘也。上者根心猛利。應捨結使纏縛。禪定惠力。心得解脫。淨身口意。出於緣務煩惱之家。永處閑靜清涼之室。是名上等出家弟子。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈出家〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0264c20</p></article></main></div></div>
