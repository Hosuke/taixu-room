    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 一念超越</nav></header><main><article><h1>一念超越</h1><p>心地了悟，一念相應，頓超生死苦海。</p><p>慧忠法師序《心經》云：「一念超越，豈在繁論者爾。」</p><p>超越者，超越生死苦海也。眾生流浪輪迴，無量無邊劫，無非迷一念而起；行人若能心地了悟，一念相應，則無明頓破，生死頓離，故曰一念超越。慧忠之意，以為此事貴在默契自心，不在多言繁論。千經萬論，皆是指月之標；心地豁然，則一月在天，不待言說也已。</p><p><strong>所出</strong>：《般若波羅蜜多心經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0251.xml</p></article></main></div></div>
