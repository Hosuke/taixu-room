    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 警誡</nav></header><main><article><h1>警誡</h1><p>六度集經云。佛因地作貧人云。</p><p>《釋氏要覽》卷中〈畏慎〉釋曰：</p><p>&gt; 六度集經云。佛因地作貧人云。吾寧守道貧賤而死。不為無道富貴而生○左傳鄭子張曰。生在警戒不在富也。君子曰善戒。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈畏慎〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0283a05</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E4%B9%9D%E6%A9%AB/">九橫</a></li><li><a href="/wiki/%E5%85%A5%E4%BF%97%E8%88%8D%E4%BA%94%E6%B3%95/">入俗舍五法</a></li><li><a href="/wiki/%E5%85%AB%E8%AA%A1/">八誡</a></li><li><a href="/wiki/%E5%8F%97%E6%96%BD%E7%9F%A5%E7%AF%80%E9%87%8F/">受施知節量</a></li><li><a href="/wiki/%E5%9B%9B%E8%81%96%E7%A8%AE/">四聖種</a></li><li><a href="/wiki/%E5%B0%8F%E9%AD%9A%E5%BF%98%E6%95%99/">小魚忘教</a></li><li><a href="/wiki/%E5%B8%82%E8%B2%B7%E7%A6%8D%E6%AF%8D/">市買禍母</a></li><li><a href="/wiki/%E5%BE%97%E4%BA%BA%E4%B8%8D%E5%8F%AF%E6%84%9B%E6%9C%89%E5%8D%81%E6%B3%95/">得人不可愛有十法</a></li><li><a href="/wiki/%E6%81%AF%E4%B8%89%E6%9A%B4%E5%AE%B3/">息三暴害</a></li><li><a href="/wiki/%E6%88%90%E5%B0%B1%E5%A8%81%E5%84%80%E5%9B%9B%E6%B3%95/">成就威儀四法</a></li><li><a href="/wiki/%E6%8B%9B%E8%BC%95%E8%B3%A4%E4%B8%89%E6%B3%95/">招輕賤三法</a></li><li><a href="/wiki/%E6%8D%A8%E4%BA%94%E6%85%B3/">捨五慳</a></li></ul></section></article></main></div></div>
