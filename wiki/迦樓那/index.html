    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 迦樓那</nav></header><main><article><h1>迦樓那</h1><p>此云悲。</p><p>《翻譯名義集》卷四〈眾善行法篇第四十八〉釋曰：</p><p>&gt; 【迦樓那】此云悲。淨覺記云：「悲曰愍傷。」《觀音玄義》云：「以觀性德惡毒，惻愴憐愍，起大悲心，欲拔其苦。」悲亦三種，名同三慈。《觀音玄義》云：「若就言說為便，初慈後悲。亦是就菩薩本懷，欲大慈與樂。既不得樂，次大悲拔苦。故初慈後悲。若從用次第者，初以大悲拔苦，方以大慈與樂。又就行者先脫苦，後蒙樂，故先悲後慈。」</p><p><strong>所出</strong>：《翻譯名義集》卷四〈眾善行法篇第四十八〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1126a20</p></article></main></div></div>
