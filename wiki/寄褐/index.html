    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 寄褐</nav></header><main><article><h1>寄褐</h1><p>今世人護惜兒孩。遂服以僧衣謂之寄褐。</p><p>《釋氏要覽》卷下〈雜紀〉釋曰：</p><p>&gt; 今世人護惜兒孩。遂服以僧衣謂之寄褐。大唐開元釋教錄云。始因中宗孝和皇帝初生奇特。神光滿院自庭燭天。因號佛光王。即受三歸。被袈裟服。至十二月五日滿月。勅為佛光王度七僧仍請奘法師為王剃髮。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈雜紀〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0304c20</p></article></main></div></div>
