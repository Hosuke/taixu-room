    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 達磨波羅</nav></header><main><article><h1>達磨波羅</h1><p>《西域記》云：「唐言護法。</p><p>《翻譯名義集》卷一〈宗釋論主篇第十〉釋曰：</p><p>&gt; 【達磨波羅】《西域記》云：「唐言護法。神負遠遁，因即出家。清辯論師，外示僧佉之服，內弘龍猛之學。聞護法菩薩在菩提樹，宣揚法教，乃命門人往問訊曰：『仰德虛心，為日久矣！然以宿願未果，遂乖禮謁。菩提樹者，誓不空見。見當有證，稱天人師。』護法菩薩謂其使曰：『人世如幻，身命若浮，未遑談議。』竟不會見。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈宗釋論主篇第十〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1067a17</p></article></main></div></div>
