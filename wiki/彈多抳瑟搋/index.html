    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 彈多抳瑟搋</nav></header><main><article><h1>彈多抳瑟搋</h1><p>（丑皆）彈多，此云齒；𢮎，此云木。</p><p>《翻譯名義集》卷三〈林木篇第三十一〉釋曰：</p><p>&gt; 【彈多抳（尼倚）瑟搋】（丑皆）彈多，此云齒；𢮎，此云木。謂齒木也。長者十二指，短者六指，多用竭陀羅木。此方無故，多用楊枝。《寄歸傳》云：「大如小指，一頭緩嚼，淨刷牙關。用罷擘破，屈而刮舌。」《五分》：「嚼已，應淨洗棄，以蟲食死故。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈林木篇第三十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1102b13</p></article></main></div></div>
