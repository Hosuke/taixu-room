    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 忍辱仙人</nav></header><main><article><h1>忍辱仙人</h1><p>[[如來]]過去五百世作忍辱仙人，無四相也。</p><p>[[如來]]言[[阿羅漢]][[須菩提]]：又念過去於五百世作忍辱仙人，於爾所世，無我相、無人相、無眾生相、無壽者相。此[[歌利王]]本事之延伸，[[忍辱非忍辱]]之究竟也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
