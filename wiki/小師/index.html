    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 小師</nav></header><main><article><h1>小師</h1><p>寄歸傳云。鐸曷攞唐言小師（受戒十夏已前。</p><p>《釋氏要覽》卷上〈師資〉釋曰：</p><p>&gt; 寄歸傳云。鐸曷攞唐言小師（受戒十夏已前。西天皆彌小師）。毘柰耶云。難陀比丘呼十七眾比丘為小師（此蓋輕呼之也）。亦通沙門之謙稱也。昔高僧名僧導。為沙彌時。叡法師見而異之問曰。君於佛法且欲何為導。對曰。願為法師作都講。叡語曰。君當為萬人法主。豈可對揚小師乎。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈師資〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0266a08</p></article></main></div></div>
