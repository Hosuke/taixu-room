    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 荷擔如來</nav></header><main><article><h1>荷擔如來</h1><p>受持讀誦廣為人說者，則為荷擔[[如來]][[無上正遍覺]]也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：若有人能受持讀誦、廣為人說，如來悉知悉見是人，皆得成就不可量、不可稱、無有邊、不可思議功德，如是人等，則為荷擔[[如來]][[無上正遍覺]]。何以故？若樂小法者，著我見、人見、眾生見、壽者見，則於此經不能聽受讀誦為人解說。此[[經功德不可限量]]之結語，大乘心之激勵也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
