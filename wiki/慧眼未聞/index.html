    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 慧眼未聞</nav></header><main><article><h1>慧眼未聞</h1><p>[[阿羅漢]]昔來所得慧眼，未曾得聞如是之經也。</p><p>[[阿羅漢]][[須菩提]]聞說是經，深解義趣，涕淚悲泣，而白[[如來]]言：希有世尊！佛說如是甚深經典，我從昔來所得慧眼，未曾得聞如是之經。此[[金剛般若]]之深妙，[[阿羅漢]]尚且希有，況凡夫乎？</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
