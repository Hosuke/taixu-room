    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 心非心</nav></header><main><article><h1>心非心</h1><p>[[如來]]說諸心皆為非心，過去、現在、未來心皆不可得也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：爾所國土中，所有眾生若干種心，如來悉知。何以故？如來說諸心，皆為非心，是名為心。所以者何？過去心不可得，現在心不可得，未來心不可得。此[[虛妄分別]]之剖析，[[現實]]之深觀也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
