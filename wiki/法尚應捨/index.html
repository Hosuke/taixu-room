    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 法尚應舍</nav></header><main><article><h1>法尚應舍</h1><p>說法如筏喻者，法尚應舍，何況非法也。</p><p>[[如來]]言[[阿羅漢]]不應取法，不應取非法。以是義故，如來常說：「汝等比丘，知我說法，如筏喻者，法尚應舍，何況非法。」此[[依法不依人]]之意，而[[教理行果]]之善巧也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E9%98%BF%E7%BE%85%E6%BC%A2/">阿羅漢</a></li><li><a href="/wiki/%E4%BE%9D%E6%B3%95%E4%B8%8D%E4%BE%9D%E4%BA%BA/">依法不依人</a></li><li><a href="/wiki/%E6%95%99%E7%90%86%E8%A1%8C%E6%9E%9C/">教理行果</a></li><li><a href="/wiki/%E7%84%A1%E6%99%BA%E4%BA%A6%E7%84%A1%E5%BE%97/">無智，亦無得</a></li><li><a href="/wiki/%E5%8C%96%E8%BA%AB/">化身</a></li><li><a href="/wiki/%E6%96%B9%E4%BE%BF%E5%93%81/">方便品</a></li></ul></section><section class="related"><h2>所出典籍</h2><ul><li><a href="/classics/%E9%87%91%E5%89%9B%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BE%85%E8%9C%9C%E7%B6%93/">金剛般若波羅蜜經</a></li></ul></section></article></main></div></div>
