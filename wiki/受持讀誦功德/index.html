    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 受持讀誦功德</nav></header><main><article><h1>受持讀誦功德</h1><p>聞此經典信心不逆，功德即勝[[阿羅漢]]身命布施也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：若有善男子、善女人，初日分以恒河沙等身布施，中日分復以恒河沙等身布施，後日分亦以恒河沙等身布施，如是無量百千萬億劫以身布施；若復有人，聞此經典，信心不逆，其福勝彼，何況書寫、受持、讀誦、為人解說。此[[恒河沙數]]功德之極說也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
