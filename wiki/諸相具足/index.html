    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 諸相具足</nav></header><main><article><h1>諸相具足</h1><p>[[如來]]諸相具足，即非具足，是名諸相具足也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：如來可以具足諸相見不？答言不也。如來不應以具足諸相見。如來說諸相具足，即非具足，是名諸相具足。此[[具足色身]]之補充，[[三十二相]]之空義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
