    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 勒沙婆</nav></header><main><article><h1>勒沙婆</h1><p>此云苦行。</p><p>《翻譯名義集》卷五〈半滿書籍篇第五十四〉釋曰：</p><p>&gt; 【勒沙婆】此云苦行。以算數為聖法，造經十萬偈，名尼乾子。此三僊說，無漏盡通，故唯五通。《宗鏡》云：「迦毘羅計因中有果；僧佉計因中無果；勒沙婆計因中亦有果亦無果。」</p><p><strong>所出</strong>：《翻譯名義集》卷五〈半滿書籍篇第五十四〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1145b06</p></article></main></div></div>
