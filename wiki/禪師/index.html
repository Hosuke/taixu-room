    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 禪師</nav></header><main><article><h1>禪師</h1><p>善住意天子所問經云。天子問文殊曰。</p><p>《釋氏要覽》卷上〈稱謂〉釋曰：</p><p>&gt; 善住意天子所問經云。天子問文殊曰。何等比丘得名禪師。文殊曰。於一切法。一行思量。所謂不生。若如是知。得名禪師。乃至無有少法可取。不取何法。所謂不取此世後世。不取三界至一切法悉不取。謂一切法悉無。眾生如是不取。得名禪師。無少取非取不取於一切法悉無所得故無憶念若不憶念彼則不修若不修者彼則不證故名禪師。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈稱謂〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0260a01</p></article></main></div></div>
