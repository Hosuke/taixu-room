    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 阿闍世</nav></header><main><article><h1>阿闍世</h1><p>此云未生怨。</p><p>《翻譯名義集》卷三〈帝王篇第二十五〉釋曰：</p><p>&gt; 【阿闍世】此云未生怨。妙樂云：「母懷之日，已有惡心。於瓶沙王，未生已惡，故因為名。」或呼婆羅留支，此云無指。妙樂云：「初生，相者云凶。王令升樓撲之不死，但損一指，故為名也。內人將護，呼為善見。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈帝王篇第二十五〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1094c13</p></article></main></div></div>
