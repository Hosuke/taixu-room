    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 震越</nav></header><main><article><h1>震越</h1><p>應法師云：「此翻衣服，應是臥具。</p><p>《翻譯名義集》卷七〈沙門服相篇第六十一〉釋曰：</p><p>&gt; 【震越】應法師云：「此翻衣服，應是臥具。」《釋名》曰：「服上曰衣。衣，依也，所以庇寒暑也。」《傳》云：「衣，身之章也。上曰衣，下曰裳。」《白虎通》曰：「衣者，隱也。裳者，障也。所以隱形自障蔽也。」《涅槃》云：「如世衣裳，障覆形體。」</p><p><strong>所出</strong>：《翻譯名義集》卷七〈沙門服相篇第六十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1170b15</p></article></main></div></div>
