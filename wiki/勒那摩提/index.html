    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 勒那摩提</nav></header><main><article><h1>勒那摩提</h1><p>或云婆提，此言寶意。</p><p>《翻譯名義集》卷一〈宗翻譯主篇第十一〉釋曰：</p><p>&gt; 【勒那摩提】或云婆提，此言寶意。中印度人。誦一億偈，博贍之富，理事兼通，光明禪法。魏宣武帝，請講《華嚴》，詞義開悟。忽於高座，見大官執笏云：「天帝請師講《華嚴》。」意曰：「今法席未終，經訖從命；然法不獨資，都講、香火、維那、梵唄，請亦定之。」使如其言。講將了，見前使來迎。果與都講等五人，俱於座終，道俗咸覩。</p><p><strong>所出</strong>：《翻譯名義集》卷一〈宗翻譯主篇第十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1070c29</p></article></main></div></div>
