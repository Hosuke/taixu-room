    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 殺三摩娑</nav></header><main><article><h1>殺三摩娑</h1><p>此云離合。</p><p>《翻譯名義集》卷六〈唐梵字體篇第五十五〉釋曰：</p><p>&gt; 【殺三摩娑】此云離合。欲顯三點非縱橫相，當示修性有離合法。三道至迷，理性之法法圓具；二因開悟，修習之事事融通。開則各離為三，對乃共合成一。論此三點，試開十門。</p><p><strong>所出</strong>：《翻譯名義集》卷六〈唐梵字體篇第五十五〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1147b05</p></article></main></div></div>
