    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 度眾生無眾生度</nav></header><main><article><h1>度眾生無眾生度</h1><p>實無有眾生[[如來]]度者，若有眾生[[如來]]度者，[[如來]]則有四相也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：汝等勿謂[[如來]]作是念「我當度眾生」。莫作是念。何以故？實無有眾生如來度者，若有眾生如來度者，如來則有我、人、眾生、壽者。此[[實無眾生得滅度者]]之重申，[[降伏其心]]之要義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
