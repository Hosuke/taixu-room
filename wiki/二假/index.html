    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二假</nav></header><main><article><h1>二假</h1><p>宗鏡錄問云不了唯識之徒妄執我法聖教之內云何復言有我法等荅云對機設假非同情執假有二種故名二假。</p><p>《大明三藏法數》卷二釋曰（出宗鏡錄）：</p><p>&gt; 宗鏡錄問云不了唯識之徒妄執我法聖教之內云何復言有我法等荅云對機設假非同情執假有二種故名二假。
&gt;
&gt; 【一無體隨情假】謂執我之法本自無體但因隨順機情虛假施設亦名我法故名無體隨情假。
&gt;
&gt; 【二有體施設假】謂聖教所說雖有法體而非我法體本無名隨緣施設假名我法故名有體施設假。</p><p><strong>所出</strong>：《大明三藏法數》卷二 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0473a05</p></article></main></div></div>
