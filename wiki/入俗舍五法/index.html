    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 入俗舍五法</nav></header><main><article><h1>入俗舍五法</h1><p>律云。一入門小語。二攝身口意。</p><p>《釋氏要覽》卷中〈畏慎〉釋曰：</p><p>&gt; 律云。一入門小語。二攝身口意。三卑躬。四善護諸根。五威儀庠序。令人生善○華首經偈云。比丘入他家。不應懷憍慢自大自高心。若有皆當滅。當以慈慜心。無欲無所求。說法廣饒益。淨行於世間。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈畏慎〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0282b17</p></article></main></div></div>
