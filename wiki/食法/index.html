    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 食法</nav></header><main><article><h1>食法</h1><p>梵摩難國王經云。夫欲食。</p><p>《釋氏要覽》卷上〈中食〉釋曰：</p><p>&gt; 梵摩難國王經云。夫欲食。譬如人身病服藥。趣令其愈。不得貪著○摩德伽論云。若得食時。口口作念。凡食限三匙為一口。第一匙默云願斷一切惡。第二匙云願修一切善。第三匙云所修善根迴向眾生。普共成佛（準論。須口口作念。若省繁。但初口三匙。總念亦得）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈中食〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0274c25</p></article></main></div></div>
