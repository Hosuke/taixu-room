    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 迦羅鳩馱迦旃延</nav></header><main><article><h1>迦羅鳩馱迦旃延</h1><p>迦羅鳩馱，此云牛領。</p><p>《翻譯名義集》卷二〈六師篇第二十〉釋曰：</p><p>&gt; 【迦羅鳩馱迦旃延】迦羅鳩馱，此云牛領。迦旃延，此云翦髮。肇曰：「姓迦旃延，字迦羅鳩馱。其人謂諸法亦有相、亦無相。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈六師篇第二十〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1085b03</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E5%88%AA%E9%97%8D%E5%A4%9C%E6%AF%98%E7%BE%85%E8%83%9D/">刪闍夜毘羅胝</a></li><li><a href="/wiki/%E5%AF%8C%E8%98%AD%E9%82%A3%E8%BF%A6%E8%91%89/">富蘭那迦葉</a></li><li><a href="/wiki/%E5%B0%BC%E7%8A%8D%E9%99%80%E8%8B%A5%E6%8F%90%E5%AD%90%E7%AD%89/">尼犍陀若提子等</a></li><li><a href="/wiki/%E6%9C%AB%E8%BF%A6%E9%BB%8E%E6%8B%98%E8%B3%92%E9%BB%8E/">末迦黎拘賒黎</a></li><li><a href="/wiki/%E9%98%BF%E8%80%86%E5%A4%9A%E7%BF%85%E8%88%8D%E6%AC%BD%E5%A9%86%E7%BE%85/">阿耆多翅舍欽婆羅</a></li></ul></section></article></main></div></div>
