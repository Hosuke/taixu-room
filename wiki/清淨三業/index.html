    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 清淨三業</nav></header><main><article><h1>清淨三業</h1><p>經云須菩提問佛色身佛即以三業荅之（梵語須菩提華言空生又云善現）。</p><p>《大明三藏法數》卷七釋曰（出瓔珞經）：</p><p>&gt; 經云須菩提問佛色身佛即以三業荅之（梵語須菩提華言空生又云善現）。
&gt;
&gt; 【一身行清淨】謂身之所行能防塞一切諸不善法是名身業清淨。
&gt;
&gt; 【二口言真誠】謂凡所言說真實誠信永離邪妄之語是名口業清淨。
&gt;
&gt; 【三意專向道】謂𭣣攝身心常居寂定無他異念是名意業清淨。</p><p><strong>所出</strong>：《大明三藏法數》卷七 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0656a02</p></article></main></div></div>
