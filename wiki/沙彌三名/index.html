    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 沙彌三名</nav></header><main><article><h1>沙彌三名</h1><p>梵語沙彌華言息慈謂息惡行慈也。</p><p>《大明三藏法數》卷七釋曰（出翻譯名義）：</p><p>&gt; 梵語沙彌華言息慈謂息惡行慈也。
&gt;
&gt; 【一驅烏沙彌】謂能驅遣烏鳥即七嵗至十二三嵗者皆名驅烏沙彌也。
&gt;
&gt; 【二應法沙彌】謂能與出家之法相應即十四嵗至十九嵗者皆名應法沙彌也。
&gt;
&gt; 【三名字沙彌】謂能止息諸惡勤行眾慈可以沙彌名字稱之即二十嵗已上皆號名字沙彌也。</p><p><strong>所出</strong>：《大明三藏法數》卷七 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0643a09</p></article></main></div></div>
