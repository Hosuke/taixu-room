    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 大乘三藏</nav></header><main><article><h1>大乘三藏</h1><p>藏即含藏之義也謂經律論三各含文理故名三藏。</p><p>《大明三藏法數》卷五釋曰（出華嚴經䟽演義鈔）：</p><p>&gt; 藏即含藏之義也謂經律論三各含文理故名三藏。
&gt;
&gt; 【一大乘經藏】經法也常也謂華嚴等諸大乘經唯談法界中道之理詮示大乘菩薩脩行證果之法是名大乘經藏。
&gt;
&gt; 【二大乘律藏】律即法也謂梵網等經唯制大乘菩薩所持之戒是名大乘律藏。
&gt;
&gt; 【三大乘論藏】論即論議謂起信等論唯决擇詮辯大乘菩薩脩證之法是名大乘論藏。</p><p><strong>所出</strong>：《大明三藏法數》卷五 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0561b06</p></article></main></div></div>
