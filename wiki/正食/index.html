    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 正食</nav></header><main><article><h1>正食</h1><p>四分律云。梵語。蒲闍尼。</p><p>《釋氏要覽》卷上〈中食〉釋曰：</p><p>&gt; 四分律云。梵語。蒲闍尼。此云正食○寄歸傳云。半者蒲善尼。唐言五噉食。謂飯餅麨等○南山鈔云。時藥。謂報命支持勿過於藥。但飢渴名主病。亦名故病。每日常有故。以食為藥醫之○順正理論云。身依食住。命托食存。食已能令身心適悅安泰故○僧祇律云。時食。謂時得食。非時不得食。今言中食以天中日午時得食當日中故言中食。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈中食〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0274a03</p></article></main></div></div>
