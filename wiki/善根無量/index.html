    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 善根無量</nav></header><main><article><h1>善根無量</h1><p>持戒修福、種諸善根，[[如來]]悉知悉見也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：如來滅後後五百歲，有持戒修福者，於此章句能生信心，以此為實。當知是人，已於無量千萬佛所種諸善根。[[如來]]悉知悉見是諸眾生，得如是無量福德。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
