    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 善根無量</nav></header><main><article><h1>善根無量</h1><p>持戒修福、種諸善根，[[如來]]悉知悉見也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：如來滅後後五百歲，有持戒修福者，於此章句能生信心，以此為實。當知是人，已於無量千萬佛所種諸善根。[[如來]]悉知悉見是諸眾生，得如是無量福德。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E9%98%BF%E7%BE%85%E6%BC%A2/">阿羅漢</a></li><li><a href="/wiki/%E9%A0%88%E8%8F%A9%E6%8F%90/">須菩提</a></li><li><a href="/wiki/%E7%A6%8F%E5%BE%B7%E6%80%A7/">福德性</a></li><li><a href="/wiki/%E8%99%9B%E7%A9%BA%E6%80%9D%E9%87%8F/">虛空思量</a></li></ul></section><section class="related"><h2>所出典籍</h2><ul><li><a href="/classics/%E9%87%91%E5%89%9B%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BE%85%E8%9C%9C%E7%B6%93/">金剛般若波羅蜜經</a></li></ul></section></article></main></div></div>
