    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 三品沙彌</nav></header><main><article><h1>三品沙彌</h1><p>僧祇律云。佛制年不滿十五。</p><p>《釋氏要覽》卷上〈剃髮〉釋曰：</p><p>&gt; 僧祇律云。佛制年不滿十五。不應作沙彌。後在迦維衛國。阿難有親里二小兒孤露阿難養育之。佛問何不出家。阿難白佛言佛制不許度。佛問是二小兒。能驅食上烏未答能。佛言聽作驅烏沙彌。最下七歲。至年十三者。皆名驅烏沙彌。若年十四。至十九名應法沙彌（今呼沙彌為法公也）若年二十已上。皆號名字沙彌。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈剃髮〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0267c19</p></article></main></div></div>
