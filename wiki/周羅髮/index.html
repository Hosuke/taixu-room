    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 周羅髮</nav></header><main><article><h1>周羅髮</h1><p>即今親教和尚。最後為剃頂上髮也。</p><p>《釋氏要覽》卷上〈剃髮〉釋曰：</p><p>&gt; 即今親教和尚。最後為剃頂上髮也。梵語周羅。此云小結。且三界九地。煩惱見修。所斷有八十一品。即第九地末品煩惱。名小結。微細難除。今此頂髮。喻彼煩惱。九十六種外道。皆不能盡除。唯佛弟子能斷故。親教師最後剃者。表為除殘結。令出三界故。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈剃髮〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0267a18</p></article></main></div></div>
