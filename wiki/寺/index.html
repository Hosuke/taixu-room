    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 寺</nav></header><main><article><h1>寺</h1><p>華題也。釋名曰寺。嗣也。</p><p>《釋氏要覽》卷上〈住處〉釋曰：</p><p>&gt; 華題也。釋名曰寺。嗣也。謂治事者。相嗣續於其內也。故天子有九寺焉。後漢明帝永平十年丁卯佛法初至。有印度二僧摩騰法蘭以白馬馱經像。屆洛陽。勅於鴻臚寺。安置（鴻臚即司賓寺也。胡廣釋云。鴻聲也。臚傳也。所以傳聲贊道九賓也。秦有典客。漢乃因之。至唐改為同文寺）。至十一年戊辰。勅於雍門外別建寺。以白馬為名。即漢土佛寺始也。吳孫權立建初寺。為始也。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈住處〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0262b27</p></article></main></div></div>
