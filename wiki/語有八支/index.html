    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 語有八支</nav></header><main><article><h1>語有八支</h1><p>顯揚論云。一美妙語。二顯了語。</p><p>《釋氏要覽》卷下〈說聽〉釋曰：</p><p>&gt; 顯揚論云。一美妙語。二顯了語。三易解語四樂聞語。五無依語（謂無望也）六不逆語（知量故）七無邊語（善巧多故）八上首語（趣涅槃宮）。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈說聽〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0294c19</p></article></main></div></div>
