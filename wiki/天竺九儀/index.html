    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 天竺九儀</nav></header><main><article><h1>天竺九儀</h1><p>西域記云。天竺致敬之式。</p><p>《釋氏要覽》卷中〈禮數〉釋曰：</p><p>&gt; 西域記云。天竺致敬之式。其儀有九。一發言問訊。二俯首示敬。三柔首高揖。四合掌手拱。五屈膝。六長跪。七手肘據地。八五輪著地。九五體投地。凡斯九等極為一拜。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈禮數〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0277b10</p></article></main></div></div>
