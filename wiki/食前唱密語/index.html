    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 食前唱密語</nav></header><main><article><h1>食前唱密語</h1><p>外道弟子。尸利毱多。即樹提伽長者姊夫也。</p><p>《釋氏要覽》卷上〈中食〉釋曰：</p><p>&gt; 外道弟子。尸利毱多。即樹提伽長者姊夫也。以毒和食請佛。及眾齋。佛知亦許之。佛語大眾。待唱僧跋。然後可食。由是眾毒竟無所害○梵摩難國王經云。夫欲施食者。皆當平等不問大小。於是佛令阿難臨飯唱僧跋。僧跋者。眾僧飯皆平等○寄歸傳云。三鉢羅佉多。舊云僧跋。訛也。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈中食〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0274c08</p></article></main></div></div>
