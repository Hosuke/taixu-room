    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 魔羅</nav></header><main><article><h1>魔羅</h1><p>《大論》云：「秦言能奪命。</p><p>《翻譯名義集》卷二〈四魔篇第十五〉釋曰：</p><p>&gt; 【魔羅】《大論》云：「秦言能奪命。死魔實能奪命，餘者能作奪命因緣，亦能奪智慧命，是故名殺者。又翻為障，能為修道作障礙故。或言惡者，多愛欲故。」垂裕云：「能殺害出世善根。第六天上，別有魔羅所居天，他化天攝。」《輔行》云：「古譯經論，魔字從石。自梁武來，謂魔能惱人，字宜從鬼。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈四魔篇第十五〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1080a18</p></article></main></div></div>
