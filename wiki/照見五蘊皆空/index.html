    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 照見五蘊皆空</nav></header><main><article><h1>照見五蘊皆空</h1><p>觀自在菩薩以深般若照見五蘊本性皆空，度脫一切苦厄。</p><p>《般若波羅蜜多心經》云：「觀自在菩薩行深般若波羅蜜多時，照見五蘊皆空，度一切苦厄。」</p><p>五蘊者，色、受、想、行、識也。皆世間生滅之法，無有實我，以般若深慧照之，則見其當體即空，非壞五蘊而後空也。色如是，受想行識亦復如是，一一皆空，無我我所。依此空慧，度脫一切苦厄，所謂三界二十五有之苦，皆悉解脫，此《心經》之宗要也。</p><p><strong>所出</strong>：《般若波羅蜜多心經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0251.xml</p></article></main></div></div>
