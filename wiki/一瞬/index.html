    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 一瞬</nav></header><main><article><h1>一瞬</h1><p>瞬者目動也律云二十瞬名一彈指謂脩行人持齋之法日正當午乃受飲食若日過午一瞬則不當食。</p><p>《大明三藏法數》卷一釋曰（出摩訶僧祇律）：</p><p>&gt; 瞬者目動也律云二十瞬名一彈指謂脩行人持齋之法日正當午乃受飲食若日過午一瞬則不當食。</p><p><strong>所出</strong>：《大明三藏法數》卷一 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0427a09</p></article></main></div></div>
