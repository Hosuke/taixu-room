    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 金銀生像</nav></header><main><article><h1>金銀生像</h1><p>沙彌十戒第九，不捉金銀生像。</p><p>《翻譯名義集》卷三〈七寶篇第三十五〉釋曰：</p><p>&gt; 【金銀生像】沙彌十戒第九，不捉金銀生像。南山云：「胡漢二彰，謂胡言生像。此翻金銀也。」《善見》云：「生色似色。似，即像也，謂金則生是黃色，銀則可染似金，故云生像。」《指歸》云：「況于闐語，與五印度語不同。若四分到于闐，自經一番翻了，經本到唐，則為重也。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈七寶篇第三十五〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1106a29</p></article></main></div></div>
