    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 凡所有相皆是虛妄</nav></header><main><article><h1>凡所有相皆是虛妄</h1><p>凡所有相，皆是虛妄；若見諸相非相，則見[[如來]]也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：可以身相見如來不？答不可以身相得見。如來所說身相，即非身相。佛遂言「凡所有相，皆是虛妄；若見諸相非相，則見如來」。此[[實慧]]之要言也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
