    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 薩迦耶</nav></header><main><article><h1>薩迦耶</h1><p>竦疏，具云薩迦耶達利瑟致。</p><p>《翻譯名義集》卷六〈煩惱惑業篇第五十六〉釋曰：</p><p>&gt; 【薩迦耶】竦疏，具云薩迦耶達利瑟致。此云身見。《百法疏》云：「謂於五蘊執我、我所，一切見趣所依為業。」</p><p><strong>所出</strong>：《翻譯名義集》卷六〈煩惱惑業篇第五十六〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1149b09</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E5%A5%A2%E4%BB%96/">奢他</a></li><li><a href="/wiki/%E5%B0%BC%E5%BB%B6%E5%BA%95/">尼延底</a></li><li><a href="/wiki/%E6%85%95%E4%BD%95/">慕何</a></li><li><a href="/wiki/%E6%8F%90%E9%9E%9E%E6%B2%99/">提鞞沙</a></li><li><a href="/wiki/%E7%BE%AF%E5%90%92%E6%96%AF/">羯吒斯</a></li><li><a href="/wiki/%E9%81%94%E6%A2%A8%E8%88%8D%E9%82%A3/">達梨舍那</a></li><li><a href="/wiki/%E9%98%BF%E6%A2%A8%E8%80%B6/">阿梨耶</a></li><li><a href="/wiki/%E9%98%BF%E7%BE%85%E4%BC%BD/">阿羅伽</a></li><li><a href="/wiki/%E9%98%BF%E8%80%86%E6%AF%98%E4%BC%BD/">阿耆毘伽</a></li></ul></section></article></main></div></div>
