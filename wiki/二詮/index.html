    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二詮</nav></header><main><article><h1>二詮</h1><p>【一遮詮】遮即止其所非詮即能詮名字謂如諸經所說真如妙性每云不生不滅不垢不淨無因無果無相無為非凡非聖非性非相等皆是遣非……</p><p>《大明三藏法數》卷三釋曰（出宗鏡錄）：</p><p>&gt; 【一遮詮】遮即止其所非詮即能詮名字謂如諸經所說真如妙性每云不生不滅不垢不淨無因無果無相無為非凡非聖非性非相等皆是遣非蕩跡絕相祛情是名遮詮（祛音驅逐也除也）。
&gt;
&gt; 【二表詮】表即顯其所是謂如諸經所說知見覺照靈鑒光明朗朗昭昭堂堂寂寂等是名表詮。</p><p><strong>所出</strong>：《大明三藏法數》卷三 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0493a02</p></article></main></div></div>
