    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 五畏</nav></header><main><article><h1>五畏</h1><p>佛地論云。一不活畏。二惡名畏。</p><p>《釋氏要覽》卷下〈躁靜〉釋曰：</p><p>&gt; 佛地論云。一不活畏。二惡名畏。三死畏。四趣畏。五怯畏（畏亦怖也）○妙色三經云。由愛故生憂。由愛故生怖。別離於愛者。無憂亦無怖。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈躁靜〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0296c07</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E4%B8%83%E6%83%85/">七情</a></li><li><a href="/wiki/%E4%B8%89%E6%91%A9%E6%8F%90/">三摩提</a></li><li><a href="/wiki/%E4%BD%9B%E6%B3%95%E4%BA%8C%E6%9F%B1/">佛法二柱</a></li><li><a href="/wiki/%E5%80%9A%E7%89%88/">倚版</a></li><li><a href="/wiki/%E5%87%BA%E5%AE%B6%E4%BA%BA%E4%B8%89%E6%AC%B2/">出家人三欲</a></li><li><a href="/wiki/%E5%9B%9B%E6%AD%A1%E5%96%9C%E7%81%8B/">四歡喜灋</a></li><li><a href="/wiki/%E5%9D%90%E7%A6%AA/">坐禪</a></li><li><a href="/wiki/%E5%AE%B4%E5%9D%90/">宴坐</a></li><li><a href="/wiki/%E5%B0%91%E6%AC%B2%E7%9F%A5%E8%B6%B3/">少欲知足</a></li><li><a href="/wiki/%E6%AC%B2/">欲</a></li><li><a href="/wiki/%E7%A6%AA/">禪</a></li><li><a href="/wiki/%E7%A6%AA%E5%B8%B6/">禪帶</a></li></ul></section></article></main></div></div>
