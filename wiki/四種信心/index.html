    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 四種信心</nav></header><main><article><h1>四種信心</h1><p>【一信根本】謂真如之法諸佛所師眾行之源能愛樂者即是信於根本故云信根本。</p><p>《大明三藏法數》卷十二釋曰（出起信論）：</p><p>&gt; 【一信根本】謂真如之法諸佛所師眾行之源能愛樂者即是信於根本故云信根本。
&gt;
&gt; 【二信佛】謂信佛有無量功德常念親近供養恭敬發起善根求一切智故云信佛。
&gt;
&gt; 【三信法】謂信受諸佛所說之法有大利益常念修行故云信法。
&gt;
&gt; 【四信僧】謂信僧能正修行自利利他常樂親近求學其道故云信僧。</p><p><strong>所出</strong>：《大明三藏法數》卷十二 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0816b02</p></article></main></div></div>
