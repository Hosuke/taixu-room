    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 不應說斷滅相</nav></header><main><article><h1>不應說斷滅相</h1><p>發[[無上正遍覺]]心者，莫作是念說諸法斷滅相也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：汝若作是念「[[如來]]不以具足相故，得[[無上正遍覺]]」，莫作是念。又若作是念「發[[無上正遍覺]]者，說諸法斷滅相」，莫作是念。此[[法與法性]]之中道，不落有見，亦不落無見也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
