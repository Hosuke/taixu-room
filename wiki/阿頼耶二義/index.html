    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 阿頼耶二義</nav></header><main><article><h1>阿頼耶二義</h1><p>梵語阿頼耶華言藏謂第八識能含藏諸法種故。</p><p>《大明三藏法數》卷二釋曰（出宗鏡錄）：</p><p>&gt; 梵語阿頼耶華言藏謂第八識能含藏諸法種故。
&gt;
&gt; 【一能攝一切法】攝謂攝持即含藏之義盖此識攝持一切善惡之法猶如庫藏含藏寶貝而不遺失也。
&gt;
&gt; 【二能生一切法】生即發生也謂此識既含藏善惡種子則一切善惡諸法從此出生猶如大地能發生草木萬物也。</p><p><strong>所出</strong>：《大明三藏法數》卷二 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0457b06</p></article></main></div></div>
