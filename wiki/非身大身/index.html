    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 非身大身</nav></header><main><article><h1>非身大身</h1><p>佛說非身，是名大身；[[阿羅漢]]之身如須彌山王也。</p><p>[[如來]]問[[阿羅漢]][[須菩提]]：譬如有人，身如須彌山王，是身為大不？答言甚大。佛說非身，是名大身。此[[凡所有相皆是虛妄]]之別說，[[法身]]之隱義也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
