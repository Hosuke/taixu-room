    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 即非般若波羅蜜</nav></header><main><article><h1>即非般若波羅蜜</h1><p>[[如來]]說般若波羅蜜，則非般若波羅蜜，是名般若波羅蜜也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：是經名為「[[金剛般若波羅蜜]]」。佛說般若波羅蜜，則非般若波羅蜜。此經首尾呼應，皆以「即非」「是名」立說，闡[[法與法性]]之圓融也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
