    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 經法所出</nav></header><main><article><h1>經法所出</h1><p>一切[[如來]]及諸佛[[無上正遍覺]]法，皆從此經出也。</p><p>[[如來]]言[[阿羅漢]][[須菩提]]：若有[[阿羅漢]]滿三千大千世界七寶以用布施，是人所得福德寧為多不？甚多。然若復有人，於此經中受持乃至四句偈等，為他人說，其福勝彼。何以故？一切[[如來]]及諸佛[[無上正遍覺]]法，皆從此經出。[[金剛般若]]之殊勝，此之謂也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
