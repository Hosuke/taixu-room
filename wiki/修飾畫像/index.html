    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 修飾畫像</nav></header><main><article><h1>修飾畫像</h1><p>根本目得伽論云。佛言若佛形像。</p><p>《釋氏要覽》卷下〈雜紀〉釋曰：</p><p>&gt; 根本目得伽論云。佛言若佛形像。泥塑虧損。苾芻生疑。不敢修飾。佛言或增大。或可相似。隨意而作諸彩畫壁。不分明者。應可拂除。更為新畫。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈雜紀〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0304a12</p></article></main></div></div>
