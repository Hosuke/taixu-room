    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 妙覺</nav></header><main><article><h1>妙覺</h1><p>悟法無生之理，證最極之佛果。</p><p>慧忠法師序《心經》云：「悟法無生，名為妙覺。」</p><p>無生者，了一切法不生不滅之理也。諸法緣生，無有自性，故無實生，亦無實滅。悟此無生之理者，即證妙覺果位。妙覺者，諸佛之異名，以其智用微妙，不可思議，故名妙覺。慧忠以此開示《心經》之究竟歸趣：非徒遣相空心而已，要使行人悟法無生，趣入如來妙覺之域。</p><p><strong>所出</strong>：《般若波羅蜜多心經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0251.xml</p></article></main></div></div>
