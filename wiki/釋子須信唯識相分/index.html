    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 釋子須信唯識相分</nav></header><main><article><h1>釋子須信唯識相分</h1><p>凡富貴貧賤好醜得失。皆是過去自造善惡業種子。</p><p>《釋氏要覽》卷下〈躁靜〉釋曰：</p><p>&gt; 凡富貴貧賤好醜得失。皆是過去自造善惡業種子。總別依正果也。皆由第八識相分所變。故云。相分已定。鬼神不能移也○優婆塞戒經云智者了知是業果。云何說言時節星宿自在天作耶。若是時節星宿因緣者。天下有同時同宿生。云何復有一人受苦。一人受樂。一人是男。一人是女耶○正法念經云。善不善業。眾生自作。非星宿作。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈躁靜〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0297a03</p></article></main></div></div>
