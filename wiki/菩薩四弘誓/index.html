    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 菩薩四弘誓</nav></header><main><article><h1>菩薩四弘誓</h1><p>【一心如大地】謂願我心如大地長養眾生道芽善種皆成聖果。</p><p>《大明三藏法數》卷十二釋曰（出陀羅尼雜集）：</p><p>&gt; 【一心如大地】謂願我心如大地長養眾生道芽善種皆成聖果。
&gt;
&gt; 【二心如橋舡】謂願我心如橋舡運度眾生不滯中流達於彼岸。
&gt;
&gt; 【三心如大海】謂願我心如大海涵育眾生同得真源霑於法味。
&gt;
&gt; 【四身如虛空】謂願我身如虛空包含萬物與諸眾生平等無二同證法性。</p><p><strong>所出</strong>：《大明三藏法數》卷十二 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0824a04</p></article></main></div></div>
