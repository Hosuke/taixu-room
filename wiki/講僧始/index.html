    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 講僧始</nav></header><main><article><h1>講僧始</h1><p>講經。即曹魏時朱士行講道行般若為始也。</p><p>《釋氏要覽》卷下〈說聽〉釋曰：</p><p>&gt; 講經。即曹魏時朱士行講道行般若為始也。尼講。以東晉道馨。講法華維摩二經為始也。講律。即元魏世法聰為始。聰但手披目閱。敷揚四分律。有門人道覆。旋聽旋抄。漸成䟽焉。講論。即羅什授嵩法師成實論。為始也。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈說聽〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0295b21</p></article></main></div></div>
