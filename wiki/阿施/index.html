    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 阿施</nav></header><main><article><h1>阿施</h1><p>秦言義。</p><p>《翻譯名義集》卷五〈四十二字篇第五十一〉釋曰：</p><p>&gt; 【阿施】秦言義。《大品》施字，經本作施字門，入諸法施字不可得故。論曰：「若聞他字，即知一切法義不可得。」《華嚴》唱曷攞多（上聲）字，名生死境界智慧輪。疏云：「即執著義性，執著為生死境，義即智慧輪。」</p><p><strong>所出</strong>：《翻譯名義集》卷五〈四十二字篇第五十一〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1135c22</p></article></main></div></div>
