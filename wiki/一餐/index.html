    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 一餐</nav></header><main><article><h1>一餐</h1><p>一餐者一餐之食也盖言聲聞之人於般若會上蒙佛加被為諸菩薩說大乘法聲聞自謂小乘而於大法不生喜樂譬若見食而不能餐經云而無希……</p><p>《大明三藏法數》卷一釋曰（出法華經）：</p><p>&gt; 一餐者一餐之食也盖言聲聞之人於般若會上蒙佛加被為諸菩薩說大乘法聲聞自謂小乘而於大法不生喜樂譬若見食而不能餐經云而無希取一餐之意是也。</p><p><strong>所出</strong>：《大明三藏法數》卷一 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0428b02</p></article></main></div></div>
