    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 三增上學</nav></header><main><article><h1>三增上學</h1><p>戒定慧三者，為修行之三增上學，由之行可證無上正遍覺。</p><p>三增上學者，戒、定、慧也。</p><p>持戒為修行之初階，戒行清淨則心不擾亂。</p><p>修禪定以制伏散亂，令心寂靜。</p><p>由定發慧，得了悟法界實相之大智慧。</p><p>如此修行，可得無上正遍覺，即大菩提果，證知法界諸法實相。</p><p><strong>所出</strong>：《太虛大師全書．第一編　佛法總學(第1卷-第26卷)》 — https://github.com/cbeta-org/xml-p5/blob/master/TX/TX01/TX01n0001.xml</p></article></main></div></div>
