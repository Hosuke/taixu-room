    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 帝利耶瞿榆泥伽</nav></header><main><article><h1>帝利耶瞿榆泥伽</h1><p>此云旁行，此道眾生，多覆身行。</p><p>《翻譯名義集》卷二〈畜生篇第二十二〉釋曰：</p><p>&gt; 【帝利耶瞿榆泥伽】此云旁行，此道眾生，多覆身行。《婆沙》云：「其形旁故，其行亦旁。」《刊正》云：「行行不正，受果報旁，負天而行，故云旁行。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈畜生篇第二十二〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1087b29</p></article></main></div></div>
