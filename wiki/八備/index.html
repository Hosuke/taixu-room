    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 八備</nav></header><main><article><h1>八備</h1><p>隋彥琮。法師云。夫預翻譯有八備。</p><p>《釋氏要覽》卷中〈志學〉釋曰：</p><p>&gt; 隋彥琮。法師云。夫預翻譯有八備。十條。一誠心受法。志在益人。二將踐勝場。先牢戒足。三文詮三藏。義貫五乘。四傍涉文史。工綴典詞。不過魯拙。五㦗怉平恕。器量虛融。不好專執。沈於道術。淡於名利。不欲高衒。六要識梵言。七不墜彼學。八博閱蒼雅粗諳篆隷不昧此文。十條者。一句韻。二問答。三名義。四經論。五歌頌。六呪功。七品題。八專業。九字部。十字聲。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈志學〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0293b21</p></article></main></div></div>
