    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 歌利王</nav></header><main><article><h1>歌利王</h1><p>[[如來]]昔為歌利王割截身體，無四相也。</p><p>[[如來]]言[[阿羅漢]][[須菩提]]：如我昔為歌利王割截身體，我於爾時，無我相、無人相、無眾生相、無壽者相。此[[忍辱非忍辱]]之本事，[[降伏其心]]之典範也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
