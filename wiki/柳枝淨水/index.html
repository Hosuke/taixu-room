    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 柳枝淨水</nav></header><main><article><h1>柳枝淨水</h1><p>比人風俗每至重午等毒節日皆以盆盛水。</p><p>《釋氏要覽》卷下〈雜紀〉釋曰：</p><p>&gt; 比人風俗每至重午等毒節日皆以盆盛水。內插柳枝。置之門前辟惡按灌頂經云。昔維耶黎城民遭疫。有一年少比丘名禪提奉佛教。持摩訶神呪。往為辟之疫人皆愈。其禪提住彼國。二十九年。民安。至其遷化。民復遭疫。民思禪徥。遂往其住處。但見所嚼齒木擲地成林。林下有泉。民酌其水。折楊枝掃拂洒。病者皆愈。毒氣消亡。辟除眾惡。萬事吉祥故。</p><p><strong>所出</strong>：《釋氏要覽》卷下〈雜紀〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0305a07</p></article></main></div></div>
