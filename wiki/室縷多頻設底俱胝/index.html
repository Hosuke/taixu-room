    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 室縷多頻設底俱胝</nav></header><main><article><h1>室縷多頻設底俱胝</h1><p>《西域記》云：「唐言聞二百億。</p><p>《翻譯名義集》卷一〈總諸聲聞篇第九〉釋曰：</p><p>&gt; 【室縷（力生）多頻設底俱胝（丁尼切）】《西域記》云：「唐言聞二百億。舊譯曰億耳，謬也。長者豪富，晚有繼嗣，時有報者，輒賜金錢二百億，因名其子曰聞二百億。洎乎成立，未曾履地，故其足跖（音隻），毛長尺餘，光潤細軟。」又《西域記》云：「富一億財一洛叉，便耳著珠墜，人知富也。或云耳有珠環，價直一億。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈總諸聲聞篇第九〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1065b12</p></article></main></div></div>
