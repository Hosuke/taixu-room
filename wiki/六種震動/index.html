    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 六種震動</nav></header><main><article><h1>六種震動</h1><p>普佛世界六種震動，表大法將興之瑞。</p><p>六種震動者，大法將興之瑞象也。</p><p>佛說《無量義經》已，入於無量義處三昧。是時，天雨妙[[華]]，普佛世界六種震動。動、踊、起、震、吼、搖，一時俱作。</p><p>六種震動，表如來說法之殊勝，震動眾生無明執著之心地。又配合[[白毫相光]]之放現，預示[[妙法蓮華經|妙法]]之宣說。[[四部大眾]]見此瑞相，得未曾有，歡喜合掌，一心觀佛，知大法當興焉。</p><p><strong>所出</strong>：《妙法蓮華經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T09/T09n0262.xml</p></article></main></div></div>
