    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 舍夷</nav></header><main><article><h1>舍夷</h1><p>《文句》云：「舍夷者，貴姓也，此名訛略，正云奢夷耆耶。</p><p>《翻譯名義集》卷一〈釋尊姓字第四〉釋曰：</p><p>&gt; 【舍夷】《文句》云：「舍夷者，貴姓也，此名訛略，正云奢夷耆耶。《本行經》云：『以住釋迦大樹蓊欝枝條之林，是故名為奢夷耆耶。』此以其處而立於姓，故國名舍夷。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈釋尊姓字第四〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1060a13</p><section class="related"><h2>相關條目</h2><ul><li><a href="/wiki/%E5%89%8E%E5%B8%9D%E5%88%A9/">剎帝利</a></li><li><a href="/wiki/%E6%91%A9%E7%B4%8D%E7%B8%9B%E8%BF%A6/">摩納縛迦</a></li><li><a href="/wiki/%E7%9E%BF%E6%9B%87/">瞿曇</a></li><li><a href="/wiki/%E8%96%A9%E5%A9%86%E6%82%89%E9%81%94/">薩婆悉達</a></li></ul></section></article></main></div></div>
