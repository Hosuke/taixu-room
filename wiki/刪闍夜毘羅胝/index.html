    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 刪闍夜毘羅胝</nav></header><main><article><h1>刪闍夜毘羅胝</h1><p>刪闍夜，此云正勝。</p><p>《翻譯名義集》卷二〈六師篇第二十〉釋曰：</p><p>&gt; 【刪闍夜毘羅胝（竹尼切）】刪闍夜，此云正勝。毘羅胝，此云不作。什曰：「刪闍夜，字也。毘羅胝，母名也。其人起見，謂要久逕生死彌歷劫數，然後自盡苦際也。」肇曰：「其人謂道不須求，逕生死劫數，苦盡自得。如轉縷（力主）圓於高山，縷盡自止，何假求也？」《疏》又云：「八萬劫滿，自然得道。」</p><p><strong>所出</strong>：《翻譯名義集》卷二〈六師篇第二十〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1085a19</p></article></main></div></div>
