    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 精進二種相</nav></header><main><article><h1>精進二種相</h1><p>【一世間精進】謂諸菩薩精進勇猛勤修布施持戒等諸福業如是精進依諸果報依諸福業有漏有取是名世間精進。</p><p>《大明三藏法數》卷二釋曰（出地藏十輪經）：</p><p>&gt; 【一世間精進】謂諸菩薩精進勇猛勤修布施持戒等諸福業如是精進依諸果報依諸福業有漏有取是名世間精進。
&gt;
&gt; 【二出世間精進】謂諸菩薩勇猛精進於諸眾生其心平等除滅一切煩惱業苦如是精進無漏無取無所依止是名出世間精進。</p><p><strong>所出</strong>：《大明三藏法數》卷二 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0466b02</p></article></main></div></div>
