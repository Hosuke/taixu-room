    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 十戒</nav></header><main><article><h1>十戒</h1><p>有二種。一沙彌十戒。僧祇律云。</p><p>《釋氏要覽》卷上〈戒法〉釋曰：</p><p>&gt; 有二種。一沙彌十戒。僧祇律云。一離殺生。二離不與取。三離非梵行。四離妄語。五離飲酒。六離處高廣大床。七離着華鬘瓔珞塗身熏衣。八離作歌舞及往觀聽蓄種種樂器。九離蓄金銀錢寶。十離非時食○二菩薩十戒者加前五戒。六不自讚毀他。七不說在家出家菩薩過失。八不貪。九不嗔。十不謗三寶（此十戒名無盡戒者。婆沙云。菩薩尸羅無我我所離一切所得滅諸戲論故名無盡）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈戒法〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0272a13</p></article></main></div></div>
