    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 一切恭信</nav></header><main><article><h1>一切恭信</h1><p>凡禮佛。首唱此言者。收攝眾心。</p><p>《釋氏要覽》卷中〈三寶〉釋曰：</p><p>&gt; 凡禮佛。首唱此言者。收攝眾心。不馳散故。一者普及為言。切者盡際為語。恭者束身翹仰。信者心無異心（信本為敬避廟諦也）○智度論云。一切有二。一名字一切。二實一切。今以名字歸實理也。或問禮拜三業何攝。答。通三業。若五輪著地。是身業。稱佛名號。是口業。緣想聖境。專注不散。是意業。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈三寶〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0287c22</p></article></main></div></div>
