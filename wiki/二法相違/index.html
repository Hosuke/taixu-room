    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二法相違</nav></header><main><article><h1>二法相違</h1><p>【一煩惱】昬煩之法惱亂心神即無明貪愛之惑也謂諸眾生隨順煩惱流轉生死故違涅槃之道也。</p><p>《大明三藏法數》卷二釋曰（出瑜伽師地論）：</p><p>&gt; 【一煩惱】昬煩之法惱亂心神即無明貪愛之惑也謂諸眾生隨順煩惱流轉生死故違涅槃之道也。
&gt;
&gt; 【二涅槃】梵語涅槃華言滅度謂諸眾生厭生死苦脩習梵行斷諸煩惱證大涅槃故違煩惱之惑也。</p><p><strong>所出</strong>：《大明三藏法數》卷二 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0449a05</p></article></main></div></div>
