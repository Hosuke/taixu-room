    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二果二義</nav></header><main><article><h1>二果二義</h1><p>二果即斯陁含華言一往來而有二義焉。</p><p>《大明三藏法數》卷三釋曰（出析玄記）：</p><p>&gt; 二果即斯陁含華言一往來而有二義焉。
&gt;
&gt; 【一一往天上】謂第二果人猶有欲界下三品惑共潤一往來身若於人中得第二果則一往天上一來人間便證第三果是名一往天上。
&gt;
&gt; 【二一往人間】謂第一果人若在天中得第二果則一往人間一來天上便證第三果是名一往人間。</p><p><strong>所出</strong>：《大明三藏法數》卷三 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0502a01</p></article></main></div></div>
