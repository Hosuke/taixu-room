    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 度小兒緣起</nav></header><main><article><h1>度小兒緣起</h1><p>僧祇律云。佛住舍衛國。阿難有一知識。</p><p>《釋氏要覽》卷上〈師資〉釋曰：</p><p>&gt; 僧祇律云。佛住舍衛國。阿難有一知識。合門疫死。唯有一小兒在。阿難行過。小兒隨後喚。阿難不聞。為世人譏云。沙門他有強親。今見孤遺不顧。小兒隨入祇園。阿難白佛。此小兒得度否。佛言汝作何心度。答慈愍心。佛言得度（度此小兒。亦不作童子。便剃髮號。驅鳥沙彌）。</p><p><strong>所出</strong>：《釋氏要覽》卷上〈師資〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0266c20</p></article></main></div></div>
