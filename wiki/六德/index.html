    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 六德</nav></header><main><article><h1>六德</h1><p>梵音婆伽婆。或云薄伽梵。</p><p>《釋氏要覽》卷中〈三寶〉釋曰：</p><p>&gt; 梵音婆伽婆。或云薄伽梵。此含六義。一自在。二熾盛。三端嚴。四名稱。五吉祥。六尊貴○親光菩薩造佛地論釋云。謂如來永不繫屬諸煩惱故。具自在義。焰猛智火所燒鍊故。具熾盛義。妙三十二大士相等所莊飾故。具端嚴義。一切殊勝功德圓滿無不知故。具名稱義。一切世間。親近供養。咸稱讚故。具吉祥義。具一切德。常起方便利益。安樂一切有情。無懈廢故。具尊貴義。</p><p><strong>所出</strong>：《釋氏要覽》卷中〈三寶〉 — https://cbetaonline.dila.edu.tw/zh/T54n2127_p0284b10</p></article></main></div></div>
