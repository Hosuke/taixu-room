    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 實無眾生得滅度者</nav></header><main><article><h1>實無眾生得滅度者</h1><p>滅度一切眾生已，而無有一眾生實滅度者也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：[[阿羅漢]]發[[無上正遍覺]]心者，當生如是心——我應滅度一切眾生；滅度一切眾生已，而無有一眾生實滅度者。何以故？若[[阿羅漢]]有四相，則非[[阿羅漢]]。所以者何？實無有法發[[無上正遍覺]]者。此[[無餘涅槃]]之深義，[[降伏其心]]之究竟也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
