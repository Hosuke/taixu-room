    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 平等法</nav></header><main><article><h1>平等法</h1><p>是法平等，無有高下，是名[[無上正遍覺]]也。</p><p>[[如來]]告[[阿羅漢]][[須菩提]]：佛得[[無上正遍覺]]，為無所得耶？實無有少法可得，是名[[無上正遍覺]]。是法平等，無有高下，是名[[無上正遍覺]]。以無我、無人、無眾生、無壽者，修一切善法，則得[[無上正遍覺]]。所言善法者，如來說非善法，是名善法。此[[一切法皆是佛法]]之正解也。</p><p><strong>所出</strong>：《金剛般若波羅蜜經》 — https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml</p></article></main></div></div>
