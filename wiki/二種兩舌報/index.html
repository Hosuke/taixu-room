    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二種兩舌報</nav></header><main><article><h1>二種兩舌報</h1><p>謂向彼說此向此說彼闘構是非離間和合致令乖分故名兩舌。</p><p>《大明三藏法數》卷四釋曰（出法苑珠林）：</p><p>&gt; 謂向彼說此向此說彼闘構是非離間和合致令乖分故名兩舌。
&gt;
&gt; 【一得弊惡眷屬】得弊惡眷屬者謂因前世兩舌使人朋儔分離乖間皆生怨惡故感今生得弊惡眷屬也。
&gt;
&gt; 【二得不和眷屬】得不和眷屬者謂因前世兩舌離間人之親愛使不和合故感今生得不和眷屬也。</p><p><strong>所出</strong>：《大明三藏法數》卷四 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0536b09</p></article></main></div></div>
