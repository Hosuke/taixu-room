    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 東弗于逮</nav></header><main><article><h1>東弗于逮</h1><p>《西域記》云：「海中可居者，大略有四焉。</p><p>《翻譯名義集》卷三〈世界篇第二十七〉釋曰：</p><p>&gt; 【東弗于逮】《西域記》云：「海中可居者，大略有四焉。東毘提訶洲，舊曰弗婆提，又曰弗于逮，訛也。此云勝，勝南洲故。又云前，一在諸方之前也。又翻為初，謂日初出處也。」《俱舍》云：「東毘提訶洲，其相如半月，身長八肘，壽二百五十。」</p><p><strong>所出</strong>：《翻譯名義集》卷三〈世界篇第二十七〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1096a15</p></article></main></div></div>
