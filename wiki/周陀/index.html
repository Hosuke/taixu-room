    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 周陀</nav></header><main><article><h1>周陀</h1><p>或云周利，此云大路邊生。</p><p>《翻譯名義集》卷一〈總諸聲聞篇第九〉釋曰：</p><p>&gt; 【周陀】或云周利，此云大路邊生。《佛本行經》云：「其母是長者之女，隨夫他國，久而有孕。垂產思歸，行至中路，即誕其子。如是二度，凡生二子，乃以大小而區別之。大即周陀，小即莎伽陀。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈總諸聲聞篇第九〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1065a10</p></article></main></div></div>
