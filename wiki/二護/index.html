    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 二護</nav></header><main><article><h1>二護</h1><p>【一內護】內即自己身心也謂佛所制大小乘戒人若受持則能防護身口意業之非成就種智菩提之果此禁戒所以為內護也。</p><p>《大明三藏法數》卷四釋曰（出涅槃經）：</p><p>&gt; 【一內護】內即自己身心也謂佛所制大小乘戒人若受持則能防護身口意業之非成就種智菩提之果此禁戒所以為內護也。
&gt;
&gt; 【二外護】外即族親眷屬也謂人之脩行湏屏絕緣務凡有所需衣服飲食湯藥之類必藉族親眷屬左右供給庶得身心安隱成辦道業此族親眷屬所以為外護也。</p><p><strong>所出</strong>：《大明三藏法數》卷四 — https://cbetaonline.dila.edu.tw/zh/P181n1615_p0511a03</p></article></main></div></div>
