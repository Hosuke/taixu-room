    <div id="root"><div data-prerender><header><nav><a href="/">太虛間</a> › <a href="/wiki/">辭林</a> › 剎帝利</nav></header><main><article><h1>剎帝利</h1><p>肇曰：「王種也，秦言田主。</p><p>《翻譯名義集》卷一〈釋尊姓字第四〉釋曰：</p><p>&gt; 【剎帝利】肇曰：「王種也，秦言田主。劫初人食地味，轉食自然粳米。後人情漸偽，各有封殖。遂立有德，處平分田，此王者之始也。故相承為名，為其尊貴自在，強暴快意，不能忍和也。」什曰：「梵音中含二義：一言忍辱，二言能嗔。言此人有大力勢，能大嗔恚，忍受苦痛，剛強難伏，因以為姓。」</p><p><strong>所出</strong>：《翻譯名義集》卷一〈釋尊姓字第四〉 — https://cbetaonline.dila.edu.tw/zh/T54n2131_p1060a17</p></article></main></div></div>
